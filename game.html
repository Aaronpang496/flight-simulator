<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Island Flight</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101827;
  color: #edf2f7;
  font-family: system-ui, sans-serif;
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 8px;
}

.version {
  text-align: center;
  color: #86efac;
  font-size: 12px;
  padding: 6px;
}

#stage {
  position: relative;
  height: 560px;
  overflow: hidden;
  border-radius: 12px;
  background: #99ccec;
}

#stage canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#menu {
  position: absolute;
  inset: 0;
  z-index: 5;
  padding: 22px;
  background: rgba(10,19,34,.97);
  overflow: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#menu.hidden { display: none; }

h2 {
  color: #a5f3fc;
  margin: 0 0 10px;
}

label {
  display: block;
  font-size: 13px;
  margin: 8px 0;
}

select {
  width: 100%;
  padding: 9px;
  margin-top: 4px;
  background: #24344d;
  color: white;
  border: 1px solid #64748b;
  border-radius: 7px;
  font: inherit;
}

button {
  padding: 11px;
  border: 0;
  border-radius: 8px;
  background: #a5f3fc;
  color: #083344;
  font: bold 14px system-ui;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button:disabled { opacity: .5; }

#launch { margin-top: 12px; }

#loadMessage {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  padding: 7px;
  background: rgba(10,19,34,.82);
  color: #fde68a;
  font-size: 12px;
  border-radius: 6px;
  pointer-events: none;
  z-index: 6;
}

#instruments {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 6px;
  margin: 10px 0;
}

.instrument {
  background: #1d293c;
  border-radius: 8px;
  padding: 9px;
  text-align: center;
  font-size: 12px;
}

.instrument strong {
  display: block;
  font-size: 19px;
  color: #a5f3fc;
}

#status {
  min-height: 45px;
  padding: 8px;
  text-align: center;
  color: #fde68a;
  font-size: 14px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 10px 0;
}

.buttons button {
  flex: 1;
  min-width: 110px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 18px;
  padding: 8px;
}

details {
  margin: 12px 0;
  padding: 12px;
  background: #1d293c;
  border-radius: 9px;
}

summary {
  cursor: pointer;
  color: #a5f3fc;
  font-weight: bold;
}

.cameraGrid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 6px 16px;
}

small {
  display: block;
  color: #adbbcf;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 8px;
}

#controlsFound {
  color: #86efac;
}

#fallback {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 10;
}

.fallbackPanel {
  pointer-events: auto;
  background: rgba(15,23,42,.85);
  border: 1px solid #475569;
  border-radius: 12px;
  margin: 10px;
}

.panelTitle {
  text-align: center;
  color: #a5f3fc;
  font-size: 10px;
  font-weight: bold;
  margin: 4px;
}

#stickPanel { left: 8px; padding: 7px; }
#powerPanel { right: 8px; width: 126px; padding: 7px; }

#stick {
  width: 166px;
  height: 158px;
  border-radius: 14px;
  border: 1px solid #64748b;
  background: linear-gradient(90deg, transparent 49%, rgba(148,163,184,.25) 50%, transparent 51%), rgba(15,23,42,.75);
  overflow: hidden;
  touch-action: none;
  position: relative;
}

#knob {
  width: 120px;
  height: 82px;
  left: 50%;
  top: 50%;
  margin: -41px 0 0 -60px;
  pointer-events: none;
  filter: drop-shadow(0 5px 3px rgba(0,0,0,.65));
  position: absolute;
}

#yokeWheel {
  display: block;
  width: 120px;
  height: 82px;
  transform-origin: 50% 65%;
}

.yokeGuide { position: absolute; top: 5px; width: 100%; text-align: center; color: #a5b4c9; font-size: 9px; pointer-events: none; }
.bottomGuide { top: auto; bottom: 5px; }
.handleHint { margin-top: 4px; text-align: center; color: #a5b4c9; font-size: 9px; }

#throttleLever {
  position: relative;
  height: 158px;
  border: 1px solid #64748b;
  border-radius: 12px;
  background: linear-gradient(90deg, #111827, #334155, #111827);
  touch-action: none;
}

.leverTrack { position: absolute; width: 9px; top: 22px; bottom: 22px; left: calc(50% - 4.5px); border-radius: 5px; background: #020617; box-shadow: inset 1px 0 3px #000; pointer-events: none; }
.leverLabel { position: absolute; width: 100%; text-align: center; color: #cbd5e1; font-size: 9px; pointer-events: none; }
.fullLabel { top: 4px; }
.idleLabel { bottom: 4px; }

#throttleGrip {
  position: absolute;
  left: 50%;
  top: calc(100% - 24px);
  width: 78px;
  height: 38px;
  transform: translate(-50%, -50%);
  border: 2px solid #94a3b8;
  border-radius: 9px;
  background: linear-gradient(#596579, #1e293b 50%, #111827);
  box-shadow: 0 5px 6px rgba(0,0,0,.7);
  pointer-events: none;
}

.gripRidges { height: 7px; margin: 4px 7px 0; background: repeating-linear-gradient(90deg, #94a3b8 0px, #94a3b8 2px, transparent 2px, transparent 7px); opacity: .6; }
#overlayPower { display: block; color: #a5f3fc; text-align: center; font-size: 13px; line-height: 38px; }
.miniButtons { display: flex; gap: 4px; margin-top: 6px; }
.miniButtons button { flex: 1; padding: 5px; font-size: 10px; }

@media(max-width:600px) {
  #stage { height: 390px; }
  .cameraGrid { grid-template-columns: 1fr; }
  #stick { width: 140px; height: 140px; }
  #powerPanel { width: 112px; }
  #throttleLever { height: 140px; }
}
</style>
</head>

<body>
<div class="wrap">
  <div class="version">INTERACTIVE COCKPIT PROTOTYPE</div>

  <div id="stage">
    <div id="menu">
      <h2>✈️ ISLAND FLIGHT</h2>
      <label>Airport setting
        <select id="airport">
          <option value="heathrow">London Heathrow — long runway</option>
          <option value="juliana">Princess Juliana — coastal runway</option>
          <option value="kaitak">Historic Kai Tak — harbor setting</option>
        </select>
      </label>
      <label>Starting position
        <select id="startMode">

        </select>
      </label>
      <label>Weather
        <select id="weather">
          <option value="clear">Clear — calm</option>
          <option value="crosswind">Crosswind — 8 knots</option>
        </select>
      </label>
      <button id="launch" disabled>Loading engine…</button>
    </div>

    <div id="loadMessage">Loading 3D engine…</div>

    <div id="fallback">
      <div id="stickPanel" class="fallbackPanel">
        <div class="panelTitle">GRAB THE YOKE</div>
        <div id="stick" aria-label="Flight yoke">
          <div class="yokeGuide">PUSH: NOSE DOWN</div>
          <div id="knob">
            <svg id="yokeWheel" viewBox="0 0 160 100">
              <defs>
                <linearGradient id="yokeMetal" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#697586"/>
                  <stop offset=".45" stop-color="#273345"/>
                  <stop offset="1" stop-color="#111827"/>
                </linearGradient>
              </defs>
              <path d="M68 58 L92 58 L98 98 L62 98 Z" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
              <path d="M20 16 L39 16 L39 48 Q39 58 51 58 L109 58 Q121 58 121 48 L121 16 L140 16 L140 49 Q140 77 111 77 L49 77 Q20 77 20 49 Z" fill="url(#yokeMetal)" stroke="#94a3b8" stroke-width="3"/>
              <rect x="16" y="8" width="27" height="42" rx="10" fill="#17202e" stroke="#64748b" stroke-width="2"/>
              <rect x="117" y="8" width="27" height="42" rx="10" fill="#17202e" stroke="#64748b" stroke-width="2"/>
              <rect x="24" y="12" width="11" height="8" rx="3" fill="#ef4444"/>
              <rect x="125" y="12" width="11" height="8" rx="3" fill="#ef4444"/>
              <rect x="63" y="55" width="34" height="21" rx="5" fill="#0f172a" stroke="#94a3b8"/>
              <text x="80" y="69" text-anchor="middle" fill="#e2e8f0" font-size="9">FLIGHT</text>
            </svg>
          </div>
          <div class="yokeGuide bottomGuide">PULL: NOSE UP</div>
        </div>
        <div class="handleHint">← BANK · BANK →</div>
      </div>

      <div id="powerPanel" class="fallbackPanel">
        <div class="panelTitle">THROTTLE LEVER</div>
        <div id="throttleLever" aria-label="Throttle lever">
          <div class="leverLabel fullLabel">FULL</div>
          <div class="leverTrack"></div>
          <div id="throttleGrip">
            <div class="gripRidges"></div>
            <span id="overlayPower">0%</span>
          </div>
          <div class="leverLabel idleLabel">IDLE</div>
        </div>
        <input id="throttle" type="hidden" min="0" max="100" value="0">
        <div class="miniButtons">
          <button id="flaps">Flaps DOWN</button>
          <button id="brakes">Brake OFF</button>
        </div>
      </div>
    </div>
  </div>

  <div id="instruments">
    <div class="instrument">Airspeed<strong id="speed">0 kt</strong></div>
    <div class="instrument">Height<strong id="altitude">0 ft</strong></div>
    <div class="instrument">VS<strong id="vertical">0 ft/min</strong></div>
    <div class="instrument">Heading<strong id="heading">000°</strong></div>
    <div class="instrument">Power<strong id="power">0%</strong></div>
    <div class="instrument">State<strong id="flightState">READY</strong></div>
  </div>

  <div id="status">Choose a starting position.</div>

  <div class="buttons">
    <button id="camera">Camera: CHASE</button>
    <button id="pause">Pause</button>
    <button id="restart">Setup</button>
  </div>

  <details>
    <summary>Camera Adjustments</summary>
    <div class="cameraGrid">
      <label>X<input id="eyeX" type="range" min="-1.5" max="1.5" step=".01" value="0"></label>
      <label>Y<input id="eyeY" type="range" min="-1.5" max="1.5" step=".01" value="0"></label>
      <label>Z<input id="eyeZ" type="range" min="-3" max="3" step=".01" value="0"></label>
      <label>Yaw<input id="lookYaw" type="range" min="-180" max="180" step="1" value="0"></label>
      <label>Pitch<input id="lookPitch" type="range" min="-60" max="60" step="1" value="-5"></label>
    </div>
    <div class="buttons">
      <button id="hideGlass">Window glass: HIDDEN</button>
      <button id="turnModel">Turn cockpit 180°</button>
      <button id="resetView">Reset view</button>
    </div>
  </details>

  <small id="controlsFound"></small>
</div>

<!-- THE FIX: Safari/iPad compatible Three.js scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("game");
// We don't need the canvas variable anymore because the renderer creates its own inside #stage, 
// but I'll leave it here just in case it breaks something else.
</script>

<script>
"use strict";

const $ = id => document.getElementById(id);
const stage = $("stage");

let THREE_LOADED = false;
let renderer, scene, camera;
let plane, cockpitRig, cockpitModel;
const animatedParts = [];
const glassMaterials = [];

const position = new THREE.Vector3();
const velocity = new THREE.Vector3();
const quaternion = new THREE.Quaternion();
const wind = new THREE.Vector3();

let state = "menu";
let chase = true;
let pitch = 0, bank = 0, yaw = 0;
let pitchRate = 0, bankRate = 0;
let throttle = 0;
let flaps = true;
let brakes = false;
let grounded = true;
let landed = false;
let airspeed = 0;
let alpha = 0;
let message = "";
let stickX = 0, stickY = 0;
let stickPointer = null;
let cockpitTouch = null;

let cockpitReady = false;
let cockpitNotice = "Cockpit loading...";
let glassHidden = true;
let modelTurned = false;

const MASS = 1100;
const AREA = 16.2;
const G = 9.81;
const GROUND_Y = 1.5;
const airport = { length: 3900, width: 50, heading: 90, coast: false };

function init3D() {
    try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.outputEncoding = THREE.sRGBEncoding; // R128 uses outputEncoding
        renderer.domElement.style.touchAction = "none";
        renderer.setSize(stage.clientWidth, stage.clientHeight);
        stage.insertBefore(renderer.domElement, stage.firstChild);

        scene = new THREE.Scene();
        scene.background = new THREE.Color("#99ccec");
        scene.fog = new THREE.Fog("#99ccec", 2400, 12000);

        camera = new THREE.PerspectiveCamera(65, stage.clientWidth / stage.clientHeight, .2, 20000);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x63764b, 2.2));
        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.position.set(-400, 800, 300);
        scene.add(sun);

        plane = new THREE.Group();
        scene.add(plane);
        
        cockpitRig = new THREE.Group();
        cockpitRig.visible = false;
        scene.add(cockpitRig);
        
        cockpitModel = new THREE.Group();
        cockpitRig.add(cockpitModel);

        buildAirport();
        buildPlane();

        const loader = new THREE.GLTFLoader();
        loader.crossOrigin = 'anonymous';
        const assetBase = "https://raw.githubusercontent.com/Aaronpang496/flight-simulator/main/";
        
        loader.load(assetBase + "cockpit.glb", (gltf) => {
            const model = gltf.scene;
            cockpitModel.add(model);
            cockpitModel.rotation.set(0, -Math.PI/2, 0);
            cockpitRig.updateMatrixWorld(true);
            
            const bounds = new THREE.Box3().setFromObject(cockpitModel);
            const center = bounds.getCenter(new THREE.Vector3());
            cockpitModel.position.x -= center.x;
            cockpitModel.position.y += -1.2 - bounds.min.y;
            
            cockpitReady = true;
            cockpitNotice = "Cockpit loaded.";
            $("loadMessage").textContent = cockpitNotice;
            setTimeout(() => $("loadMessage").style.display = 'none', 2000);
        }, undefined, (error) => {
            console.error(error);
            cockpitNotice = "Cockpit failed to load. (View will be empty).";
            $("loadMessage").textContent = cockpitNotice;
            setTimeout(() => $("loadMessage").style.display = 'none', 3000);
        });

        $("launch").disabled = false;
        $("launch").textContent = "Start flight";

        // Start Loop
        let previous = performance.now();
        function frame(now) {
            const dt = Math.min((now - previous) / 1000, .05);
            previous = now;
            if (state === "playing") {
                const steps = Math.max(1, Math.ceil(dt / .008));
                for (let i = 0; i < steps; i++) physics(dt / steps);
            }
            if (state !== "menu") {
                updateAircraft(dt);
                updateCamera(dt);
                hud();
            }
            renderer.render(scene, camera);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // Resize
        window.addEventListener('resize', () => {
            renderer.setSize(stage.clientWidth, stage.clientHeight);
            camera.aspect = stage.clientWidth / stage.clientHeight;
            camera.updateProjectionMatrix();
        });

    } catch (e) {
        $("loadMessage").textContent = "Engine Error: " + e.message;
        console.error(e);
    }
}

function material(color) {
    return new THREE.MeshStandardMaterial({ color, roughness: .8 });
}

function box(parent, x, y, z, sx, sy, sz, mat) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
}

function buildPlane() {
    const white = material("#f1f5f9");
    const blue = material("#0891b2");
    const dark = material("#243449");

    box(plane, 0, 0, 0, 1.05, 1.05, 6, white);
    box(plane, 0, .1, -.4, 10.5, .18, 1.5, blue);
    box(plane, 0, .45, 2.1, 3.4, .14, .9, blue);
    box(plane, 0, 1.05, 2.1, .15, 1.6, 1.1, blue);
    box(plane, 0, .7, -.8, .85, .6, 1.6, dark);
    plane.userData.propeller = box(plane, 0, 0, -3.1, 2.8, .12, .1, dark);
    plane.visible = false;
}

function buildAirport() {
    const sea = material("#2a93b5");
    const land = material("#618154");
    const runway = material("#353c45");
    const stripe = material("#f1f5f9");
    const building = material("#a7b3c4");

    box(scene,0,-12,0,26000,10,26000,sea);
    box(scene,0,-3,0, 1400, 5, airport.length + 250, land);
    box(scene,0,-.06,0, airport.width,.12,airport.length, runway);

    for (let z = -airport.length/2 + 60; z < airport.length/2 - 60; z += 100) {
      box(scene,0,.03,z,1.2,.04,35,stripe);
    }
}

function physics(dt) {
    const pitchInput = Math.max(-1, Math.min(1, stickY + Number(keys.has("ArrowDown")) - Number(keys.has("ArrowUp"))));
    const rollInput = Math.max(-1, Math.min(1, stickX + Number(keys.has("ArrowRight")) - Number(keys.has("ArrowLeft"))));
    const rudder = Number(keys.has("q")) - Number(keys.has("e"));

    if (keys.has("w")) { throttle = Math.min(1,throttle+dt*.3); syncPower(); }
    if (keys.has("s")) { throttle = Math.max(0,throttle-dt*.3); syncPower(); }

    const authority = Math.max(0.15, Math.min(airspeed/32, 1.4));
    pitchRate += (pitchInput*.85*authority - pitchRate*3.2)*dt;
    bankRate += (-rollInput*2.1*authority - bankRate*3.5)*dt;
    pitch = Math.max(-0.65, Math.min(0.65, pitch+pitchRate*dt));
    bank = Math.max(-1.15, Math.min(1.15, bank+bankRate*dt));

    if (grounded) {
      bank *= Math.exp(-dt*8);
      pitch = Math.max(0, Math.min(pitch, airspeed>25 ? .22 : .035));
      yaw += (rudder-rollInput)*.22*Math.max(0, Math.min(velocity.length()/12,1))*dt;
    } else {
      yaw += (Math.tan(bank)*G / Math.max(airspeed,20) + rudder*.12)*dt;
    }
    
    quaternion.setFromEuler(new THREE.Euler(pitch,yaw,bank,"YXZ"));

    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(quaternion);
    const right = new THREE.Vector3(1,0,0).applyQuaternion(quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(quaternion);

    const airflow = velocity.clone().sub(wind);
    airspeed = airflow.length();
    const airDirection = airspeed>.1 ? airflow.clone().divideScalar(airspeed) : forward.clone();
    alpha = airspeed>5 ? Math.atan2(-airflow.dot(up), Math.max(.1,airflow.dot(forward))) : 0;
    const density = 1.225*Math.exp(-Math.max(0,position.y)/8500);
    const pressure = .5*density*airspeed*airspeed;

    let cl = Math.max(-1.2, Math.min(.25 + 4.5*alpha + (flaps ? .4 : 0), flaps ? 1.8 : 1.5));
    const stalled = Math.abs(alpha)>.27;
    if (stalled) cl *= Math.max(.25,1-(Math.abs(alpha)-.27)*2);
    const cd = .032 + .055*cl*cl + (flaps ? .045 : 0) + (stalled ? .16 : 0);

    const liftDirection = right.clone().cross(airDirection).normalize();
    const force = new THREE.Vector3(0,-MASS*G,0);
    force.addScaledVector(forward, throttle*3300 * Math.max(0.5, Math.min(density/1.225,1)));
    force.addScaledVector(liftDirection, pressure*AREA*cl);
    force.addScaledVector(airDirection, -pressure*AREA*cd);
    velocity.addScaledVector(force, dt/MASS);

    if (grounded) {
      const horizontal = new THREE.Vector3(velocity.x,0,velocity.z);
      const speed = horizontal.length();
      if (speed>.001) {
        const loss = Math.min(speed,(brakes ? 4.2 : .18)*dt);
        velocity.x -= horizontal.x/speed*loss;
        velocity.z -= horizontal.z/speed*loss;
      }
      const flatRight = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
      const sideways = velocity.dot(flatRight);
      velocity.addScaledVector(flatRight, -sideways*Math.min(1,dt*7));
      if (force.y>MASS*.2 && airspeed>25) {
        grounded = false;
        message = "Airborne! Ease the yoke toward center.";
      } else {
        velocity.y = 0;
      }
    }

    position.addScaledVector(velocity,dt);

    if (!grounded && position.y<=GROUND_Y) {
      const sinkRate = Math.max(0,-velocity.y);
      position.y = GROUND_Y;
      if (!onRunway()) { crash("Touchdown outside the runway."); return; }
      if (sinkRate>3 || Math.abs(bank)>.18 || Math.abs(pitch)>.25 || airspeed>52) {
        crash("Touchdown too hard, fast, or tilted."); return;
      }
      velocity.y = 0;
      grounded = true; landed = true;
      pitchRate = bankRate = 0;
      message = "Touchdown! Apply brakes.";
    }

    if (grounded) {
      position.y = GROUND_Y;
      if (!onRunway()) { crash("You left the runway."); return; }
      if (landed && velocity.length()<1) {
        state = "complete";
        clearControls();
        message = "LANDING COMPLETE!";
      }
    }

    if (!grounded && stalled && airspeed<35) {
      pitch = Math.max(-0.65, Math.min(pitch-.12*dt,0.65));
    }
    quaternion.setFromEuler(new THREE.Euler(pitch,yaw,bank,"YXZ"));
}

function updateAircraft(dt) {
    plane.position.copy(position);
    plane.quaternion.copy(quaternion);
    plane.visible = chase;
    if (cockpitReady) {
      cockpitRig.position.copy(position);
      cockpitRig.quaternion.copy(quaternion);
    }
    cockpitRig.visible = cockpitReady && !chase && state !== "menu";
    if (state === "playing" && plane.userData.propeller) {
        plane.userData.propeller.rotation.z += (15+throttle*100)*dt;
    }
}

function updateCamera(dt,snap=false) {
    if (state === "menu") return;
    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(quaternion);

    if (chase) {
      const desired = position.clone().addScaledVector(forward,-24).add(new THREE.Vector3(0,9,0));
      if (snap) camera.position.copy(desired);
      else camera.position.lerp(desired,1-Math.exp(-dt*5));
      camera.up.set(0,1,0);
      camera.lookAt(position.clone().addScaledVector(forward,45));
    } else {
      const eye = new THREE.Vector3(0,1.2,-1.6).applyQuaternion(quaternion).add(position);
      camera.position.copy(eye);
      const lookRotation = new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
          THREE.MathUtils.degToRad(Number($("lookPitch").value)),
          THREE.MathUtils.degToRad(Number($("lookYaw").value)),
          0, "YXZ"
        )
      );
      camera.quaternion.copy(quaternion).multiply(lookRotation);
    }
    const near = chase ? .2 : .02;
    if (camera.near !== near) {
      camera.near = near;
      camera.updateProjectionMatrix();
    }
}

function crash(reason) {
    if (state !== "playing") return;
    state = "crashed";
    clearControls();
    message = "CRASH: " + reason;
}

function onRunway() {
    return Math.abs(position.x) <= airport.width/2 && Math.abs(position.z) <= airport.length/2;
}

function hud() {
    const heading = ((airport.heading-yaw*180/Math.PI)%360+360)%360;
    $("speed").textContent = Math.round(airspeed*1.94384)+" kt";
    $("altitude").textContent = Math.max(0,Math.round((position.y-GROUND_Y)*3.28084))+" ft";
    $("vertical").textContent = Math.round(velocity.y*196.85)+" ft/min";
    $("heading").textContent = String(Math.round(heading)%360).padStart(3,"0")+"°";
    $("power").textContent = Math.round(throttle*100)+"%";
    let label = grounded ? "ON RUNWAY" : "FLYING";
    if (state === "paused") label = "PAUSED";
    if (state === "crashed") label = "CRASHED";
    if (state === "complete") label = "STOPPED";
    if (state === "playing" && !grounded && Math.abs(alpha)>.27) label = "STALL!";
    $("flightState").textContent = label;
    $("flightState").style.color = ["CRASHED","STALL!"].includes(label) ? "#fb7185" : "#a5f3fc";
    $("status").textContent = state === "paused" ? "Paused." : message;
}

$("launch").onclick = () => {
    state = "playing";
    position.set(0, 1.5, -120);
    velocity.set(0, 0, 0);
    pitch = 0; bank = 0; yaw = 0;
    quaternion.identity();
    clearControls();
    plane.visible = true;
    $("menu").classList.add("hidden");
    message = "Runway ready.";
    updateAircraft(0);
    updateCamera(1,true);
};

$("camera").onclick = () => {
    clearControls(); chase = !chase; 
    $("camera").textContent = chase ? "Camera: CHASE" : "Camera: COCKPIT";
    if (state!=="menu") { updateAircraft(0); updateCamera(1,true); }
};

$("pause").onclick = () => {
    if (state === "playing") { state = "paused"; clearControls(); $("pause").textContent = "Resume"; }
    else if (state === "paused") { state = "playing"; $("pause").textContent = "Pause"; }
};

const keys = new Set();
window.addEventListener("keydown", (e) => {
    keys.add(e.key);
});
window.addEventListener("keyup", (e) => {
    keys.delete(e.key);
});

// Initialize
init3D();
</script>
</body>
</html>
