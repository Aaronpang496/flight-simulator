<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Island Flight - Fixed</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101827;
  color: #edf2f7;
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden; /* Prevent scrolling on iPad */
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 8px;
}

.version {
  text-align: center;
  color: #86efac;
  font-size: 12px;
  padding: 6px;
}

#stage {
  position: relative;
  height: 80vh;
  overflow: hidden;
  border-radius: 12px;
  background: #99ccec;
}

#stage canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#menu {
  position: absolute;
  inset: 0;
  z-index: 5;
  padding: 22px;
  background: rgba(10,19,34,.97);
  overflow: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#menu.hidden { display: none; }

h2 {
  color: #a5f3fc;
  margin: 0 0 10px;
}

label {
  display: block;
  font-size: 13px;
  margin: 8px 0;
}

select {
  width: 100%;
  padding: 9px;
  margin-top: 4px;
  background: #24344d;
  color: white;
  border: 1px solid #64748b;
  border-radius: 7px;
  font: inherit;
}

button {
  padding: 11px;
  border: 0;
  border-radius: 8px;
  background: #a5f3fc;
  color: #083344;
  font: bold 14px system-ui;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

button:disabled { opacity: .5; }
#launch { margin-top: 12px; }

#loadMessage {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  padding: 7px;
  background: rgba(10,19,34,.82);
  color: #fde68a;
  font-size: 12px;
  border-radius: 6px;
  pointer-events: none;
  z-index: 6;
}

#instruments {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 6px;
  margin: 10px 0;
}

.instrument {
  background: #1d293c;
  border-radius: 8px;
  padding: 9px;
  text-align: center;
  font-size: 12px;
}

.instrument strong {
  display: block;
  font-size: 19px;
  color: #a5f3fc;
}

#status {
  min-height: 45px;
  padding: 8px;
  text-align: center;
  color: #fde68a;
  font-size: 14px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 10px 0;
}

.buttons button {
  flex: 1;
  min-width: 110px;
}

#fallback {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 10;
}

.fallbackPanel {
  pointer-events: auto;
  background: rgba(15,23,42,.85);
  border: 1px solid #475569;
  border-radius: 12px;
  margin: 10px;
}

.panelTitle {
  text-align: center;
  color: #a5f3fc;
  font-size: 10px;
  font-weight: bold;
  margin: 4px;
}

#stickPanel { left: 8px; padding: 7px; }
#powerPanel { right: 8px; width: 126px; padding: 7px; }

#stick {
  width: 140px;
  height: 140px;
  border-radius: 14px;
  border: 1px solid #64748b;
  background: rgba(15,23,42,.75);
  touch-action: none;
  position: relative;
}

#knob {
  width: 80px;
  height: 80px;
  left: 50%;
  top: 50%;
  margin: -40px 0 0 -40px;
  border-radius: 50%;
  background: #334155;
  border: 2px solid #94a3b8;
  pointer-events: none;
  position: absolute;
}

#throttleLever {
  position: relative;
  height: 140px;
  border: 1px solid #64748b;
  border-radius: 12px;
  background: linear-gradient(90deg, #111827, #334155, #111827);
  touch-action: none;
}

#throttleGrip {
  position: absolute;
  left: 50%;
  top: calc(100% - 24px);
  width: 78px;
  height: 38px;
  transform: translate(-50%, -50%);
  border: 2px solid #94a3b8;
  border-radius: 9px;
  background: linear-gradient(#596579, #1e293b 50%, #111827);
  pointer-events: none;
}

#overlayPower {
  display: block;
  color: #a5f3fc;
  text-align: center;
  font-size: 13px;
  line-height: 38px;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="version">FIXED PROTOTYPE (IPAD COMPATIBLE)</div>

  <div id="stage">
    <div id="menu">
      <h2>✈️ ISLAND FLIGHT</h2>
      <label>
        Airport setting
        <select id="airport">
          <option value="heathrow">London Heathrow</option>
          <option value="kaitak" selected>Historic Kai Tak</option>
        </select>
      </label>
      <label>
        Weather
        <select id="weather">
          <option value="clear">Clear</option>
          <option value="crosswind">Crosswind</option>
        </select>
      </label>
      <button id="launch">Start Flight</button>
    </div>

    <div id="loadMessage">Loading 3D engine...</div>

    <div id="fallback">
      <div id="stickPanel" class="fallbackPanel">
        <div class="panelTitle">YOKE</div>
        <div id="stick">
          <div id="knob"></div>
        </div>
      </div>

      <div id="powerPanel" class="fallbackPanel">
        <div class="panelTitle">THROTTLE</div>
        <div id="throttleLever">
          <div id="throttleGrip">
            <span id="overlayPower">0%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="instruments">
    <div class="instrument">Airspeed<strong id="speed">0 kt</strong></div>
    <div class="instrument">Height<strong id="altitude">0 ft</strong></div>
    <div class="instrument">VS<strong id="vertical">0 ft/min</strong></div>
  </div>

  <div id="status">Choose a setting and start.</div>
  <div class="buttons">
    <button id="pause">Pause</button>
    <button id="restart">Setup</button>
  </div>
</div>

<!-- THE FIX: Using Global Scripts for Safari/iPad compatibility -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
"use strict";

const $ = id => document.getElementById(id);
const stage = $("stage");

let scene, camera, renderer;
let planeGroup;
let velocity = new THREE.Vector3();
let position = new THREE.Vector3(0, 1.5, 0);
let quaternion = new THREE.Quaternion();
let pitch = 0, bank = 0, yaw = 0;
let airspeed = 0;
let throttle = 0;
let state = "menu";

let stickX = 0, stickY = 0;
let stickPointer = null;

function init3D() {
    try {
        scene = new THREE.Scene();
        scene.background = new THREE.Color("#99ccec");
        scene.fog = new THREE.Fog("#99ccec", 400, 2000);

        camera = new THREE.PerspectiveCamera(65, stage.clientWidth / stage.clientHeight, 0.1, 10000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(stage.clientWidth, stage.clientHeight);
        stage.insertBefore(renderer.domElement, stage.firstChild);

        // Lights
        scene.add(new THREE.HemisphereLight(0xffffff, 0x63764b, 1.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(-200, 400, 150);
        scene.add(sun);

        // Build Aircraft
        buildPlane();
        
        // Build World
        buildWorld();

        $("loadMessage").textContent = "";
        $("launch").disabled = false;

        // Start Render Loop
        let previous = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - previous) / 1000, 0.1);
            previous = now;

            if (state === "playing") {
                physics(dt);
            }
            updateCamera();
            renderer.render(scene, camera);
        }
        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = stage.clientWidth / stage.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(stage.clientWidth, stage.clientHeight);
        });

    } catch (e) {
        $("loadMessage").textContent = "Error: " + e.message;
        console.error(e);
    }
}

function buildPlane() {
    planeGroup = new THREE.Group();
    
    const white = new THREE.MeshStandardMaterial({ color: 0xf1f5f9 });
    const blue = new THREE.MeshStandardMaterial({ color: 0x0891b2 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x243449 });

    // Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.05, 6), white);
    planeGroup.add(body);

    // Wings
    const wings = new THREE.Mesh(new THREE.BoxGeometry(10.5, 0.18, 1.5), blue);
    wings.position.set(0, 0.1, -0.4);
    planeGroup.add(wings);

    // Tail
    const tailWing = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.14, 0.9), blue);
    tailWing.position.set(0, 0.45, 2.1);
    planeGroup.add(tailWing);

    const tailFin = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.6, 1.1), blue);
    tailFin.position.set(0, 1.05, 2.1);
    planeGroup.add(tailFin);

    // Propeller
    const prop = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.12, 0.1), dark);
    prop.position.set(0, 0, -3.1);
    planeGroup.add(prop);
    planeGroup.userData.propeller = prop;

    planeGroup.visible = false;
    scene.add(planeGroup);
}

function buildWorld() {
    const sea = new THREE.MeshStandardMaterial({ color: 0x2a93b5 });
    const land = new THREE.MeshStandardMaterial({ color: 0x618154 });
    const runway = new THREE.MeshStandardMaterial({ color: 0x353c45 });

    const seaMesh = new THREE.Mesh(new THREE.BoxGeometry(5000, 10, 5000), sea);
    seaMesh.position.y = -12;
    scene.add(seaMesh);

    const landMesh = new THREE.Mesh(new THREE.BoxGeometry(2000, 5, 5000), land);
    landMesh.position.y = -3;
    scene.add(landMesh);

    const runMesh = new THREE.Mesh(new THREE.BoxGeometry(50, 0.2, 3000), runway);
    runMesh.position.y = -0.06;
    scene.add(runMesh);

    // Add some simple city blocks for Kai Tak feel
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0xa7b3c4 });
    for (let i = 0; i < 50; i++) {
        const h = 15 + Math.random() * 100;
        const b = new THREE.Mesh(new THREE.BoxGeometry(20, h, 20), buildingMat);
        b.position.set(
            (Math.random() > 0.5 ? 1 : -1) * (100 + Math.random() * 400),
            h / 2 - 2,
            (Math.random() - 0.5) * 3000
        );
        scene.add(b);
    }
}

function physics(dt) {
    if (!planeGroup) return;

    // Apply inputs
    const targetPitch = stickY * 0.5;
    const targetBank = -stickX * 1.0;
    
    pitch += (targetPitch - pitch) * dt * 2;
    bank += (targetBank - bank) * dt * 2;

    // If on ground and speeding up, allow takeoff
    if (position.y <= 1.5 && airspeed > 40 && pitch > 0.1) {
        position.y += 0.1;
    }

    // Simple physics
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quaternion);
    
    if (position.y > 1.5) {
        velocity.y -= 9.81 * dt;
        velocity.y += (airspeed * Math.sin(pitch)) * dt * 1.5;
        bank = Math.max(-1.2, Math.min(1.2, bank));
        yaw += Math.tan(bank) * dt * (airspeed / 50);
    } else {
        velocity.y = 0;
        pitch = Math.max(0, pitch);
    }

    velocity.z = -throttle * 100;
    airspeed = Math.abs(velocity.z);
    
    if (velocity.z < 0) {
        position.add(new THREE.Vector3(0, 0, velocity.z * dt));
    }
    position.y += velocity.y * dt;

    // Keep inside bounds
    if (position.y < 1.5) { position.y = 1.5; velocity.y = 0; }

    // Update 3D model
    planeGroup.position.copy(position);
    quaternion.setFromEuler(new THREE.Euler(pitch, yaw, bank, "YXZ"));
    planeGroup.quaternion.copy(quaternion);

    if (planeGroup.userData.propeller) {
        planeGroup.userData.propeller.rotation.z += (15 + throttle * 50) * dt;
    }

    // HUD
    $("speed").textContent = Math.round(airspeed * 1.9) + " kt";
    $("altitude").textContent = Math.max(0, Math.round((position.y - 1.5) * 3.28)) + " ft";
}

function updateCamera() {
    if (!planeGroup || state === "menu") return;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quaternion);
    const desired = position.clone().addScaledVector(forward, -25).add(new THREE.Vector3(0, 8, 0));
    
    camera.position.lerp(desired, 0.1);
    camera.up.set(0, 1, 0);
    camera.lookAt(position.clone().addScaledVector(forward, 40));
}

// UI Logic
$("launch").onclick = () => {
    state = "playing";
    planeGroup.visible = true;
    position.set(0, 1.5, 0);
    velocity.set(0, 0, 0);
    pitch = 0; bank = 0; yaw = 0;
    $("menu").classList.add("hidden");
    $("status").textContent = "Push throttle to 100%!";
};

// Simple iPad touch controls
const stick = $("stick");
const knob = $("knob");
stick.addEventListener("pointerdown", e => {
    stickPointer = e.pointerId;
    stick.setPointerCapture(e.pointerId);
});
stick.addEventListener("pointermove", e => {
    if (e.pointerId !== stickPointer) return;
    const rect = stick.getBoundingClientRect();
    let x = (e.clientX - rect.left - rect.width/2) / (rect.width/2);
    let y = (e.clientY - rect.top - rect.height/2) / (rect.height/2);
    x = Math.max(-1, Math.min(1, x));
    y = Math.max(-1, Math.min(1, y));
    
    stickX = x;
    stickY = y;
    knob.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
});
stick.addEventListener("pointerup", e => {
    if (e.pointerId === stickPointer) {
        stickPointer = null;
        stickX = 0; stickY = 0;
        knob.style.transform = `translate(0, 0)`;
    }
});

const lever = $("throttleLever");
const grip = $("throttleGrip");
let leverPointer = null;

lever.addEventListener("pointerdown", e => {
    leverPointer = e.pointerId;
    lever.setPointerCapture(e.pointerId);
});
lever.addEventListener("pointermove", e => {
    if (e.pointerId !== leverPointer) return;
    const rect = lever.getBoundingClientRect();
    let pct = 1 - (e.clientY - rect.top) / rect.height;
    pct = Math.max(0, Math.min(1, pct));
    throttle = pct;
    grip.style.top = `calc(${(1 - pct) * 100}% - 19px)`;
    $("overlayPower").textContent = Math.round(pct * 100) + "%";
});
lever.addEventListener("pointerup", e => {
    if (e.pointerId === leverPointer) leverPointer = null;
});

// Start engine
init3D();
</script>
</body>
</html>
