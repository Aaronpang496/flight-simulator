name: Check aircraft assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Read cockpit model and list its textures
        shell: python
        run: |
          import os
          import re
          import urllib.request
          from pathlib import Path

          url = (
              "https://raw.githubusercontent.com/"
              "REXO-77/737-MAX/main/Models/Cockpit/cockpit.ac"
          )

          request = urllib.request.Request(
              url, headers={"User-Agent": "Aircraft-Asset-Check"}
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()

          text = data.decode("utf-8", errors="replace")
          if not text.startswith("AC3D"):
              raise RuntimeError("The download is not an AC3D model.")

          textures = sorted(set(re.findall(
              r'^\s*texture\s+"([^"]+)"', text, re.MULTILINE
          )))

          report = [
              "# Cockpit asset check",
              "",
              f"Model downloaded: {len(data):,} bytes",
              f"Distinct texture references: {len(textures)}",
              "",
              "## Referenced texture files",
              "",
          ]
          report += [f"- `{name}`" for name in textures]
          report += [
              "",
              "This checks source references only.",
              "No conversion or simulator changes were made.",
          ]

          result = "\n".join(report)
          print(result)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              result, encoding="utf-8"
          )
