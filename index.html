<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Island Flight</title>

<style>
*{box-sizing:border-box}
html, body {
 margin: 0; padding: 0;
 width: 100vw; height: 100vh; height: 100dvh;
 background: #101827; color: #edf2f7; font-family: system-ui, sans-serif;
 overflow: hidden; touch-action: none; user-select: none;
}
[hidden]{display:none!important}

/* --- GAME CONTAINER (Top 55%) --- */
#game {
 position: absolute; top: 0; left: 0; right: 0;
 height: 55%;
 background: #101827;
}

/* The 3D Canvas */
#stage {
 position: absolute; inset: 0;
 background: #a4cfe8;
}
#stage>canvas.world{display:block;width:100%;height:100%;touch-action:none}

/* --- HUD ELEMENTS --- */
#rain{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#notice{
 position:absolute;top:6px;left:8px;right:8px;z-index:30;
 padding:6px 8px;border-radius:6px;background:#0a1322d9;
 color:#fde68a;font-size:10px;pointer-events:none;text-align:center;
}

/* --- MENU DESIGN --- */
#menu {
 position: absolute; inset: 0; z-index: 20;
 background: #0f172af5;
 display: flex; flex-direction: column; align-items: center;
 padding: 20px 15px;
 overflow-y: auto;
}
.menuInner {
 width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px;
 margin-bottom: 50px; 
}

.world-grid {
 display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
}
.world-btn {
 background: #1e293b; border: 2px solid #334155; border-radius: 8px;
 padding: 10px 5px; text-align: center; color: #cbd5e1; font-size: 11px;
 font-weight: bold; cursor: pointer; transition: all 0.2s;
}
.world-btn:hover { border-color: #64748b; }
.world-btn.active { border-color: #a5f3fc; background: #164e63; color: #a5f3fc; box-shadow: 0 0 10px #22d3ee44; }

.aircraft-section {
 display: flex; gap: 15px; background: #1e293b; border-radius: 12px; padding: 15px;
 border: 1px solid #334155; align-items: center;
}
.aircraft-list {
 flex: 1; display: flex; flex-direction: column; gap: 8px;
}
.ac-btn {
 background: transparent; border: 1px solid #475569; border-radius: 6px;
 padding: 10px; text-align: left; color: #cbd5e1; font-size: 13px;
 cursor: pointer; transition: 0.2s;
}
.ac-btn.active { background: #334155; border-color: #a5f3fc; color: #fff; }
.aircraft-preview {
 width: 130px; height: 90px; background: #0f172a; border-radius: 8px;
 position: relative; overflow: hidden; border: 1px solid #1e293b;
}
#menu-preview-canvas { width: 100%; height: 100%; display: block; }

.diff-section { display: flex; flex-direction: column; gap: 5px; }
select {
 display: block; width: 100%; padding: 12px;
 color: white; background: #1e293b; border: 1px solid #475569;
 border-radius: 8px; font: inherit; font-size: 14px;
}

#launch { width: 100%; margin-top: 10px; padding: 15px; font-size: 16px; border-radius: 10px; background: #a5f3fc; color: #083344; font-weight: bold; }


/* --- HUD / MAP ELEMENTS --- */
#mapLabel{position:absolute;top:40px;left:10px;z-index:4;color:white;font-size:10px;text-shadow:0 1px 4px #000;pointer-events:none;max-width:55%}
#weatherLabel{position:absolute;top:70px;left:10px;z-index:4;font-size:11px;text-shadow:0 1px 4px #000;pointer-events:none}

#radarPanel{position:absolute;top:40px;right:8px;z-index:5;width:130px;padding:5px;border:1px solid #76e8c477;border-radius:12px;background:#071e25cc;pointer-events:none}
#radar{display:block;width:100%;aspect-ratio:1}
#radarText{text-align:center;font-size:9px;color:#a7f3d0;line-height:1.4}

#guidance{position:absolute;top:100px;left:10px;z-index:5;width:135px;text-align:center;background:#0a1926bd;border:1px solid #7dd3fc55;border-radius:12px;padding:6px;pointer-events:none}
#navArrow{display:block;margin:0 auto;width:36px;height:36px;color:#b9ffff;filter:drop-shadow(0 0 8px #00eaff);transform-origin:center}
#navText{font-size:9px;color:#cffafe;line-height:1.45;white-space:pre-line}

/* --- UI OVERLAY (Bottom 45% Area) --- */
#ui-overlay {
 position: absolute; top: 55%; left: 0; right: 0; bottom: 0;
 display: flex; flex-direction: column;
 background: #101827; border-top: 1px solid #334155; z-index: 10; padding: 4px;
}

#instruments{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
 gap:4px; padding:0 8px 4px; pointer-events:none;
 flex-shrink: 0;
}
.instrument{
 padding:4px 2px;background:#0f172ade;border-radius:8px;
 text-align:center;font-size:10px; border:1px solid #334155;
}
.instrument strong{display:block;color:#a5f3fc;font-size:14px}

/* Controls flex row */
#controls{
 display:flex; justify-content:space-between; gap:4px;
 padding:0 2px; margin-bottom:4px;
 flex-grow: 1; min-height: 0;
}
.panel{
 padding:3px;border:1px solid #64748b;border-radius:10px;background:#0f172ade;
 pointer-events:auto;box-shadow:0 4px 10px rgba(0,0,0,0.5);
 display:flex; flex-direction:column; min-height:0; overflow: hidden;
}
#yokePanel{width:42%}
#powerPanel{width:28%}
#autopilotPanel{width:28%;text-align:center}

.panelTitle{color:#a5f3fc;text-align:center;font-size:10px;font-weight:bold;margin-bottom:2px}
#stick{
 position:relative;flex-grow:1;min-height:50px;overflow:hidden;
 background:#0f172acc;border:1px solid #64748b;border-radius:8px;touch-action:none;
}
#knob{
 position:absolute;left:50%;top:50%;width:90px;height:65px;
 margin:-32px 0 0 -45px;pointer-events:none
}
#yoke{
 width:90px;height:65px;transform-origin:50% 65%;
 filter:drop-shadow(0 4px 3px #000)
}
.guide{font-size:8px;color:#bdcbe0;position:absolute;width:100%;text-align:center;top:2px;pointer-events:none}
.guide.bottom{top:auto;bottom:2px}

#lever{
 position:relative;flex-grow:1;min-height:50px;overflow:hidden;
 background:linear-gradient(90deg,#111827,#334155,#111827);
 border:1px solid #64748b;border-radius:8px;touch-action:none;
}
.track{position:absolute;top:16px;bottom:16px;left:calc(50% - 4px);width:8px;border-radius:4px;background:#020617}
.leverLabel{position:absolute;width:100%;text-align:center;font-size:9px;font-weight:bold;color:#cbd5e1}
.full{top:2px}.idle{bottom:2px}
#grip{
 position:absolute;left:50%;top:75%;width:70px;height:30px;
 transform:translate(-50%,-50%);border:2px solid #94a3b8;
 border-radius:8px;background:linear-gradient(#596579,#1e293b,#111827);
 pointer-events:none;box-shadow:0 4px 8px rgba(0,0,0,0.8);
}
.ridges{height:6px;margin:4px 6px 0;background:repeating-linear-gradient(90deg,#94a3b8 0,#94a3b8 2px,transparent 2px,transparent 6px)}
#gripPower{display:block;text-align:center;color:#a5f3fc;font-size:11px;margin-top:2px;font-weight:bold;}

.mini{display:flex;gap:2px;margin-top:4px;flex-shrink:0;}
.mini button{flex:1;padding:4px 0;font-size:9px;min-height:22px; background:#a5f3fc; color:#083344; border-radius:6px; border:0; font-weight:bold;}
#gear{width:100%;min-height:22px;margin-top:2px;font-size:10px; background:#a5f3fc; color:#083344; border-radius:6px; border:0; font-weight:bold;flex-shrink:0;}

#autopilotPanel button{width:100%;margin:2px 0;font-size:9px;min-height:24px;padding:2px; border-radius:6px; border:0; font-weight:bold;flex-shrink:0;}
#autopilotButton{background:#334155;color:#e2e8f0}
#assistButton{background:#25465b;color:#e0f2fe}
#goAroundButton{background:#fde68a;color:#422006}
#autopilotPanel button.engaged{background:#86efac;color:#052e16;box-shadow:0 0 10px #22c55e66}
#autopilotInfo{margin-top:2px;color:#cbd5e1;font-size:8px;line-height:1.2;white-space:pre-line; flex-grow: 1;}

/* Text hidden as requested to prevent clutter */
#status, #landingHint { display: none !important; }

/* --- 3x2 GRID FOR BUTTONS --- */
.buttons{
 display:grid;
 grid-template-columns: repeat(3, 1fr);
 gap:4px;
 padding: 4px 4px; 
 padding-bottom: max(12px, env(safe-area-inset-bottom));
 flex-shrink: 0;
}
.buttons button{
 width: 100%; min-height: 32px; font-size: 12px;
 background:#a5f3fc; color:#083344; border-radius:8px; border:0; font-weight:bold;
}

small{display:none}
output{color:#a5f3fc}
.hiddenData { display: none !important; }
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="game">
 <div id="stage">
  <canvas id="rain"></canvas>
 </div>
</div>

 <!-- MENU -->
 <div id="menu">
  <div class="menuInner">
   <h2 style="margin:0; color:#a5f3fc; text-align:center; font-size:24px;">✈️ ISLAND FLIGHT</h2>
   
   <div>
    <div style="font-size:13px; margin-bottom:5px; color:#94a3b8;">Select World</div>
    <div class="world-grid" id="world-selector">
     <button class="world-btn active" data-val="juliana">🏝️<br>Juliana</button>
     <button class="world-btn" data-val="heathrow">🌆<br>Heathrow</button>
     <button class="world-btn" data-val="kaitak">⛰️<br>Kai Tak</button>
    </div>
   </div>

   <div>
    <div style="font-size:13px; margin-bottom:5px; color:#94a3b8;">Select Aircraft</div>
    <div class="aircraft-section">
     <div class="aircraft-list" id="aircraft-selector">
      <button class="ac-btn active" data-val="boeing737">Boeing 737</button>
      <button class="ac-btn" data-val="learjet">Learjet</button>
      <button class="ac-btn" data-val="f20">F-20 Tigershark</button>
     </div>
     <div class="aircraft-preview">
      <canvas id="menu-preview-canvas"></canvas>
     </div>
    </div>
   </div>

   <div class="diff-section">
    <div style="font-size:13px; color:#94a3b8;">Flight Difficulty</div>
    <select id="difficulty">
     <option value="easy">Easy — speed, descent and flare assistance</option>
     <option value="medium">Medium — speed assistance only</option>
     <option value="hard">Hard — manual landing</option>
    </select>
   </div>

   <button id="launch" disabled>Loading engine...</button>
  </div>
 </div>

 <div id="notice">Loading 3D engine...</div>
 
 <div id="mapLabel"></div>
 <div id="weatherLabel"></div>

 <div id="radarPanel">
  <canvas id="radar" width="280" height="280"></canvas>
  <div id="radarText">RADAR · HEADING UP</div>
 </div>

 <div id="guidance">
  <svg id="navArrow" viewBox="0 0 64 64" aria-hidden="true">
   <path d="M32 5 L54 31 L39 27 L39 57 L25 57 L25 27 L10 31 Z" fill="currentColor" stroke="#eaffff" stroke-width="2"/>
  </svg>
  <div id="navText">Runway ready</div>
 </div>

 <!-- UI Overlay container -->
 <div id="ui-overlay" hidden>
  <div id="instruments">
   <div class="instrument">Airspeed<strong id="speed">0 kt</strong></div>
   <div class="instrument">Height<strong id="altitude">0 ft</strong></div>
   <div class="instrument">V/Speed<strong id="vertical">0 ft/min</strong></div>
   <div class="instrument">Heading<strong id="heading">000°</strong></div>
   <div class="instrument">Power<strong id="power">0 / 0%</strong></div>
   <div class="instrument">Time<strong id="timer">0.0 s</strong></div>
   <div class="instrument">Pitch<strong id="pitchValue">0°</strong></div>
   <div class="instrument">Bank<strong id="bankValue">0°</strong></div>
  </div>

  <div id="controls">
   <div class="panel" id="yokePanel">
    <div class="panelTitle">YOKE</div>
    <div id="stick">
     <div class="guide">NOSE DOWN</div>
     <div id="knob">
      <svg id="yoke" viewBox="0 0 160 100" aria-hidden="true">
       <path d="M68 58 L92 58 L98 98 L62 98 Z" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
       <path d="M20 16 L39 16 L39 48 Q39 58 51 58 L109 58 Q121 58 121 48 L121 16 L140 16 L140 49 Q140 77 111 77 L49 77 Q20 77 20 49 Z" fill="#273345" stroke="#94a3b8" stroke-width="3"/>
       <rect x="16" y="8" width="27" height="42" rx="10" fill="#17202e" stroke="#94a3b8" stroke-width="2"/>
       <rect x="117" y="8" width="27" height="42" rx="10" fill="#17202e" stroke="#94a3b8" stroke-width="2"/>
       <rect x="24" y="12" width="11" height="8" rx="3" fill="#ef4444"/>
       <rect x="125" y="12" width="11" height="8" rx="3" fill="#ef4444"/>
       <rect x="63" y="55" width="34" height="21" rx="5" fill="#0f172a" stroke="#94a3b8"/>
       <text x="80" y="69" text-anchor="middle" fill="#e2e8f0" font-size="9">FLIGHT</text>
      </svg>
     </div>
     <div class="guide bottom">NOSE UP</div>
    </div>
   </div>

   <div class="panel" id="autopilotPanel">
    <div class="panelTitle">ASSIST</div>
    <button id="autopilotButton" aria-pressed="false">AUTO OFF</button>
    <button id="assistButton" aria-pressed="false">APPROACH</button>
    <button id="goAroundButton">GO AROUND</button>
    <div id="autopilotInfo">Take off manually.</div>
   </div>

   <div class="panel" id="powerPanel">
    <div class="panelTitle">THROTTLE</div>
    <div id="lever">
     <div class="leverLabel full">FULL</div>
     <div class="track"></div>
     <div id="grip">
      <div class="ridges"></div>
      <span id="gripPower">0%</span>
     </div>
     <div class="leverLabel idle">IDLE</div>
    </div>
    <div class="mini">
     <button id="flaps">FLAPS</button>
     <button id="brakes">BRAKE</button>
    </div>
    <button id="gear">GEAR</button>
   </div>
  </div>

  <div id="status"></div>
  <div id="landingHint"></div>

  <div class="buttons">
   <button id="camera" disabled>Camera</button>
   <button id="pause" disabled>Pause</button>
   <button id="return">Guide</button>
   <button id="resetLook">Look</button>
   <button id="fullscreen">Full</button>
   <button id="restart" disabled>New flight</button>
  </div>
 </div>

 <small id="assets" style="display:none;"></small>

 <!-- Hidden Data for Original Logic -->
 <div class="hiddenData">
  <input id="airport" value="juliana">
  <input id="aircraftChoice" value="boeing737">
  <input id="planeSize" value="18">
  <input id="cameraDistance" value="55">
  <select id="exteriorYaw"><option value="180" selected>180</option></select>
  <input id="exteriorPitch" value="0">
  <input id="learjetLower" value="0">
  <input id="eyeX" value="0">
  <input id="eyeY" value="0">
  <input id="eyeZ" value="0">
  <input id="lookYaw" value="0">
  <input id="lookPitch" value="-5">
  <output id="sizeOut"></output>
  <output id="distanceOut"></output>
  <output id="exteriorPitchOut"></output>
  <output id="learjetLowerOut"></output>
  <output id="pitchMinOut"></output>
  <output id="pitchMaxOut"></output>
  <output id="bankMaxOut"></output>
  <output id="sinkMaxOut"></output>
  <output id="speedMaxOut"></output>
  <output id="yawMaxOut"></output>
  <input id="pitchMin" value="-10">
  <input id="pitchMax" value="22">
  <input id="bankMax" value="25">
  <input id="sinkMax" value="8">
  <input id="speedMax" value="190">
  <input id="yawMax" value="35">
  <button id="glass"></button>
  <button id="turn"></button>
  <button id="resetView"></button>
 </div>

<script>
window.gameFatal=message=>{
 document.getElementById("notice").textContent=message;
 document.getElementById("status").textContent=message;
};
window.addEventListener("error",e=>{
 window.gameFatal("Game error: "+(e.message||"Unknown error"));
});
window.addEventListener("unhandledrejection",e=>{
 window.gameFatal("Game error: "+(e.reason?.message||String(e.reason)));
});
window.startupTimer=setTimeout(()=>{
 window.gameFatal("Engine startup is slow. Check your connection and reload.");
},25000);
</script>

<script type="module">
const $=id=>document.getElementById(id);

try{
 const T=await import("three");
 const {GLTFLoader}=await import("three/addons/loaders/GLTFLoader.js");
 clearTimeout(window.startupTimer);
 initialize(T,GLTFLoader);
}catch(error){
 clearTimeout(window.startupTimer);
 $("launch").textContent="Unable to start";
 window.gameFatal("Startup failed: "+error.message);
 console.error(error);
}

function initialize(T,GLTFLoader){
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const rad=T.MathUtils.degToRad;
 const deg=T.MathUtils.radToDeg;
 const approach=(v,target,dt,tau)=>v+(target-v)*(1-Math.exp(-dt/tau));
 const wrapAngle=a=>Math.atan2(Math.sin(a),Math.cos(a));

 const base="https://raw.githubusercontent.com/Aaronpang496/flight-simulator/main/";

 const aircraftOptions={
  boeing737:{name:"Boeing 737",file:"737_max_lion_air.glb",defaultYaw:180,defaultPitch:0,modelRotation:0},
  learjet:{name:"Learjet",file:"learjet.glb",defaultYaw:180,defaultPitch:14,modelRotation:0},
  f20:{name:"F-20",file:"F-20.glb",defaultYaw:0,defaultPitch:0,modelRotation:Math.PI / 2}
 };

 let exteriorRequest=0;
 let loadedAircraftKey=null,loadingAircraftKey=null;
 const savedExteriorYaw={},savedExteriorPitch={};

 const stage=$("stage"),controls=$("controls"),uiOverlay=$("ui-overlay");

 const renderer=new T.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.outputColorSpace=T.SRGBColorSpace;
 renderer.domElement.className="world";
 stage.insertBefore(renderer.domElement,stage.firstChild);

 const scene=new T.Scene();
 const camera=new T.PerspectiveCamera(65,1,.2,40000);
 const hemi=new T.HemisphereLight(0xffffff,0x647b56,2.1);
 const sun=new T.DirectionalLight(0xfff4df,2.4);
 sun.position.set(-700,1200,500);
 scene.add(hemi,sun);

 let scenery=new T.Group();
 scene.add(scenery);
 const textures=[],mountainColliders=[];

 const weatherClouds=new T.Group();
 scene.add(weatherClouds);
 const cloudMaterial=new T.MeshStandardMaterial({
  color:"#ffffff",roughness:1,transparent:true,opacity:.85
 });
 const cloudGeometry=new T.SphereGeometry(1,8,6);
 const cloudObjects=[];
 for(let i=0;i<65;i++){
  const mesh=new T.Mesh(cloudGeometry,cloudMaterial);
  mesh.scale.set(
   200+Math.random()*300,50+Math.random()*90,150+Math.random()*180
  );
  weatherClouds.add(mesh);
  cloudObjects.push({
   mesh,x:(Math.random()-.5)*22000,
   z:(Math.random()-.5)*22000,y:850+Math.random()*1100
  });
 }

 const aircraft=new T.Group(),placeholder=new T.Group();
 const exteriorAnchor=new T.Group(),exteriorYaw=new T.Group();
 const exteriorTilt=new T.Group();
 exteriorYaw.add(exteriorTilt);
 exteriorAnchor.add(exteriorYaw);
 aircraft.add(placeholder,exteriorAnchor);
 scene.add(aircraft);

 const cockpitRig=new T.Group(),cockpitModel=new T.Group();
 cockpitRig.add(cockpitModel);
 scene.add(cockpitRig);
 aircraft.visible=cockpitRig.visible=false;

 // --- NEW: MENU 3D PREVIEW SETUP ---
 const previewCanvas = $("menu-preview-canvas");
 const previewRenderer = new T.WebGLRenderer({canvas: previewCanvas, antialias: true, alpha: true});
 previewRenderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
 previewRenderer.outputColorSpace = T.SRGBColorSpace;
 const previewScene = new T.Scene();
 const previewCamera = new T.PerspectiveCamera(45, 1, 0.1, 100);
 previewCamera.position.set(5, 3, 7);
 previewCamera.lookAt(0, 0, 0);
 previewScene.add(new T.HemisphereLight(0xffffff, 0x444444, 2));
 const previewSun = new T.DirectionalLight(0xffffff, 1.5);
 previewSun.position.set(5, 5, 5);
 previewScene.add(previewSun);
 const previewGroup = new T.Group();
 previewScene.add(previewGroup);

 function resizePreview() {
   const rect = previewCanvas.parentElement.getBoundingClientRect();
   previewRenderer.setSize(rect.width, rect.height, false);
   previewCamera.aspect = rect.width / rect.height;
   previewCamera.updateProjectionMatrix();
 }
 window.addEventListener("resize", resizePreview);
 setTimeout(resizePreview, 100);

 let previewLoadedKey = null;
 function updateMenuPreview(key) {
   if(previewLoadedKey === key) return;
   
   // Remove old
   while(previewGroup.children.length > 0) previewGroup.remove(previewGroup.children[0]);
   
   const option = aircraftOptions[key];
   if(!option) return;

   new GLTFLoader().load(base + option.file, gltf => {
     const model = gltf.scene;
     
     // Auto scale and center for the tiny preview box
     const box = new T.Box3().setFromObject(model);
     const size = box.getSize(new T.Vector3());
     const center = box.getCenter(new T.Vector3());
     const maxDim = Math.max(size.x, size.y, size.z);
     
     const scale = 4 / maxDim;
     model.scale.setScalar(scale);
     model.position.sub(center.multiplyScalar(scale));
     
     // Apply model-specific rotation and base yaw
     model.rotation.y = rad(option.defaultYaw) + (option.modelRotation || 0);
     
     previewGroup.add(model);
     previewLoadedKey = key;
   });
 }
 // ----------------------------------

 const position=new T.Vector3(),velocity=new T.Vector3();
 const rotation=new T.Quaternion(),wind=new T.Vector3();
 const pilotEye=new T.Vector3(0,1.2,-1.6),eyeOffset=new T.Vector3();
 const raycaster=new T.Raycaster(),pointer=new T.Vector2();
 const keys=new Set(),parts=[],glassMaterials=[],exteriorClips=[];

 let state="menu",chase=true,cockpitReady=false;
 let glassHidden=true,cockpitTurned=false;
 let pitch=0,bank=0,yaw=0,pitchRate=0,bankRate=0;
 let throttle=0,enginePower=0,flaps=true,brakes=false,gearDown=true;
 let grounded=true,landed=false,airspeed=0,alpha=0,airTime=0;
 let stickX=0,stickY=0;
 let stickDrag=null,leverDrag=null,cockpitDrag=null,lookDrag=null;
 let orbitYaw=0,orbitPitch=.22,headYaw=0,headPitch=0;
 let message="Choose a world and start.",stopped=false;

 let cockpitStatus="Cockpit downloading...";
 let exteriorStatus="Aircraft downloading...";
 let animationStatus="",exteriorObject=null,exteriorMixer=null,exteriorFit=null;

 const particleMaterials=[
  mat("#ff4400",{emissive:"#ff2200"}),

 ];
 function clearExplosion(){
  particles.forEach(p=>scene.remove(p.mesh));
  particles.length=0;
 }
 function explode(){
  clearExplosion();
  for(let i=0;i<90;i++){
   const mesh=new T.Mesh(
    particleGeometry,particleMaterials[Math.floor(Math.random()*3)]
   );
   mesh.position.copy(position);
   mesh.scale.setScalar(.6+Math.random()*2);
   scene.add(mesh);
   particles.push({
    mesh,life:1.8,v:new T.Vector3(
     (Math.random()-.5)*45,5+Math.random()*30,(Math.random()-.5)*45
    )
   });
  }
 }
 function updateExplosion(dt){
  for(let i=particles.length-1;i>=0;i--){
   const p=particles[i];
   p.v.y-=G*dt;
   p.mesh.position.addScaledVector(p.v,dt);
   p.mesh.rotation.x+=dt*2;
   p.mesh.rotation.y+=dt;
   p.mesh.scale.multiplyScalar(Math.exp(-dt*.5));
   p.life-=dt;
   if(p.life<=0){
    scene.remove(p.mesh);
    particles.splice(i,1);
   }
  }
 }

 function disposeMap(){
  const gs=new Set(),ms=new Set();
  scenery.traverse(o=>{
   if(o.geometry)gs.add(o.geometry);
   if(o.material){
    (Array.isArray(o.material)?o.material:[o.material])
     .forEach(m=>ms.add(m));
   }
  });
  gs.forEach(g=>g.dispose());
  ms.forEach(m=>m.dispose());
  textures.forEach(t=>t.dispose());

 function collectMountains(){
  mountainColliders.length=0;
  scenery.updateMatrixWorld(true);
  scenery.traverse(o=>{
   if(!o.userData.mountain)return;
   const c=o.getWorldPosition(new T.Vector3());
   const s=o.getWorldScale(new T.Vector3());
   mountainColliders.push({
    x:c.x,y:c.y,z:c.z,
    rx:Math.abs(s.x)+2.5,ry:Math.abs(s.y)+2.5,rz:Math.abs(s.z)+2.5
   });
  });
 }
 function mountainHit(a,b){
  let earliest=Infinity;
  for(const m of mountainColliders){
   const x=(a.x-m.x)/m.rx,y=(a.y-m.y)/m.ry,z=(a.z-m.z)/m.rz;
   const dx=(b.x-a.x)/m.rx,dy=(b.y-a.y)/m.ry,dz=(b.z-a.z)/m.rz;
   const C=x*x+y*y+z*z-1;
   if(C<=0){earliest=0;continue;}
   const A=dx*dx+dy*dy+dz*dz;
   if(A<1e-16)continue;
   const B=2*(x*dx+y*dy+z*dz);
   const discriminant=B*B-4*A*C;
   if(discriminant<0)continue;
   const t=(-B-Math.sqrt(discriminant))/(2*A);
   if(t>=0&&t<=1)earliest=Math.min(earliest,t);
  }
  return Number.isFinite(earliest)?earliest:null;
 }

 const weather={
  time:0,next:100,kind:"Clear",dark:0,rain:0,strength:2,
  direction:.4,targetDark:0,targetRain:0,targetStrength:2,targetDirection:.4
 };
 const clearSky=new T.Color(),stormSky=new T.Color("#626d79");
 const whiteCloud=new T.Color("#ffffff"),grayCloud=new T.Color("#535c68");
 const rainCanvas=$("rain"),rainCtx=rainCanvas.getContext("2d");
 let rainWidth=1,rainHeight=1;
 const drops=Array.from({length:130},()=>({
  x:Math.random(),y:Math.random(),r:1+Math.random()*3,
  speed:.03+Math.random()*.12
 }));

 function resetWeather(){
  Object.assign(weather,{
   time:0,next:90+Math.random()*60,kind:"Clear",
   dark:0,rain:0,strength:2,direction:.4,
   targetDark:0,targetRain:0,targetStrength:2,targetDirection:.4
  });
  wind.set(0,0,0);
 }
 function chooseWeather(){
  const r=Math.random();
  if(r<.38){
   weather.kind="Clear";
   weather.targetDark=.05;weather.targetRain=0;
   weather.targetStrength=2+Math.random()*3;
  }else if(r<.70){
   weather.kind="Strong wind";
   weather.targetDark=.65;weather.targetRain=0;
   weather.targetStrength=9+Math.random()*5;
  }else{
   weather.kind="Heavy rain";
   weather.targetDark=1;weather.targetRain=1;
   weather.targetStrength=7+Math.random()*6;
  }
  weather.targetDirection=weather.direction+(Math.random()-.5)*1.4;
  weather.next=weather.time+100+Math.random()*100;
 }
 function updateWeather(dt){
  weather.time+=dt;
  if(weather.time>weather.next)chooseWeather();
  weather.dark=approach(weather.dark,weather.targetDark,dt,22);
  weather.rain=approach(weather.rain,weather.targetRain,dt,18);
  weather.strength=approach(weather.strength,weather.targetStrength,dt,25);
  weather.direction=approach(weather.direction,weather.targetDirection,dt,30);
  const t=weather.time;
  const gust=1+.16*Math.sin(t*.63)+.1*Math.sin(t*1.41);
  const difficultyScale=mode()==="easy" ? .45 : mode()==="medium" ? .75 : 1;
  const strength=weather.strength*gust*difficultyScale;
  const dir=weather.direction+.08*Math.sin(t*.29);
  wind.set(
   Math.sin(dir)*strength,
   weather.dark*(Math.sin(t*.9)+.4*Math.sin(t*2.2))*.65*difficultyScale,
   Math.cos(dir)*strength
  );
 }
 function weatherVisuals(){
  clearSky.set(airport.sky);
  if(!scene.background)scene.background=new T.Color();
  scene.background.copy(clearSky).lerp(stormSky,weather.dark);
  if(!scene.fog)scene.fog=new T.Fog(scene.background,3200,20000);
  scene.fog.color.copy(scene.background);
  scene.fog.near=3200-weather.dark*1800;
  scene.fog.far=22000-weather.dark*15000;
  sun.intensity=2.4-weather.dark*1.7;
  hemi.intensity=2.1-weather.dark*.6;
  cloudMaterial.color.copy(whiteCloud).lerp(grayCloud,weather.dark);
  cloudMaterial.opacity=.72+.22*weather.dark;
  const count=Math.round(12+weather.dark*53);
  cloudObjects.forEach((c,i)=>{
   c.mesh.visible=i<count;
   c.mesh.position.set(
    c.x+Math.sin(weather.direction)*weather.time*4,
    c.y-weather.dark*350,
    c.z+Math.cos(weather.direction)*weather.time*4
   );
  });
  $("weatherLabel").textContent=weather.kind+" · effective wind "+
   Math.round(Math.hypot(wind.x,wind.z)*KNOTS)+" kt";
 }
 function drawRain(dt){
  const w=rainWidth,h=rainHeight,r=weather.rain;
  rainCtx.clearRect(0,0,w,h);
  if(r<.01||state==="menu")return;
  rainCtx.fillStyle=`rgba(25,38,55,${r*.08})`;
  rainCtx.fillRect(0,0,w,h);
  rainCtx.strokeStyle=`rgba(210,232,247,${.2+r*.25})`;
  rainCtx.lineWidth=1;
  rainCtx.beginPath();
  for(let i=0;i<Math.floor(110*r);i++){
   const d=drops[i];
   if(dt>0){
    d.y+=dt*(.45+d.speed*3);
    d.x+=dt*.08*Math.sin(weather.direction);
    if(d.y>1.1){d.y=-.1;d.x=Math.random();}
    if(d.x>1.1)d.x=-.1;
    if(d.x<-.1)d.x=1.1;
   }
   const x=d.x*w,y=d.y*h;
   rainCtx.moveTo(x,y);
   rainCtx.lineTo(x-7-weather.strength*.35,y-18-d.r*5);
  }
  rainCtx.stroke();
  for(let i=110;i<130;i++){
   const d=drops[i];
   if(dt>0){
    d.y+=dt*d.speed*.2;
    if(d.y>1.05){d.y=-.05;d.x=Math.random();}
   }
   rainCtx.beginPath();
   rainCtx.ellipse(d.x*w,d.y*h,d.r,d.r*1.8,0,0,Math.PI*2);
   rainCtx.fillStyle=`rgba(180,215,235,${r*.11})`;
   rainCtx.fill();
   rainCtx.strokeStyle=`rgba(225,245,255,${r*.35})`;
   rainCtx.stroke();
  }
 }

 function resetRoute(){
  departureAirport=groundedAirport;
  destinationAirport=1-groundedAirport;
  const from=airportSites[departureAirport],to=airportSites[destinationAirport];
  const h=airport.length/2,direction=Math.cos(yaw)>=0?-1:1;
  route=[
   {x:from.x,z:from.z+direction*(h+1400),name:"Climb straight ahead",alt:350},
   {x:to.x+3600,z:from.z+direction*(h+2500),name:"Cruise to destination",alt:650},
   {x:to.x+3600,z:to.z+h+8500,name:"Destination arrival leg",alt:520},
   {x:to.x,z:to.z+h+8500,name:"Line up with the glowing path",alt:450},
   {x:to.x,z:to.z+h-220,name:"Touchdown zone",alt:0}
  ];
  routeIndex=0;
  legStart={x:position.x,z:position.z,alt:Math.max(0,position.y-GROUND)};
  updateApproachPath();
 }
 function navTarget(){return route[Math.min(routeIndex,route.length-1)];}
 function setRouteIndex(i){
  routeIndex=i;
  legStart={x:position.x,z:position.z,alt:Math.max(0,position.y-GROUND)};

 function routeHeight(){
  const t=navTarget();
  if(!t)return 350;
  const x=t.x-legStart.x,z=t.z-legStart.z,length=x*x+z*z;
  const f=length>1?clamp(
   ((position.x-legStart.x)*x+(position.z-legStart.z)*z)/length,0,1
  ):1;
  return legStart.alt+(t.alt-legStart.alt)*f;
 }
 function finalData(){
  const s=airportSites[destinationAirport];
  const threshold=s.z+airport.length/2;
  const touchdown=threshold-220;
  const remaining=position.z-touchdown;
  const x=position.x-s.x;
  const height=Math.max(0,position.y-GROUND);
  const targetHeight=Math.max(0,remaining*Math.tan(rad(3)));
  return{
   site:s,threshold,touchdown,remaining,x,height,targetHeight,
   headingError:deg(wrapAngle(yaw)),
   outsideThreshold:position.z>threshold,
   corridor:
    remaining>0&&remaining<10000&&Math.abs(x)<1000&&
    Math.abs(deg(wrapAngle(yaw)))<40,
   aligned:Math.abs(x)<100&&Math.abs(deg(wrapAngle(yaw)))<8
  };
 }

 function insideLandingAssistEnvelope(f){
  const runwayEnd=f.site.z-airport.length/2;
  return routeIndex===4&&
   position.z>runwayEnd&&
   position.z<f.touchdown+10000&&
   Math.abs(f.x)<1200&&
   Math.abs(f.headingError)<50;
 }
 function easyLandingAssistActive(){
  return approachAssist&&!grounded&&mode()==="easy"&&
   insideLandingAssistEnvelope(finalData());
 }

 function steeringTarget(){
  if(routeIndex!==4)return navTarget();
  const f=finalData();
  return{
   x:f.site.x,z:Math.max(f.touchdown,position.z-1000),
   alt:f.targetHeight,name:"Runway centreline"
  };
 }
 function updateNavigation(){
  if(grounded||!route.length)return;
  const target=navTarget();
  const dx=target.x-position.x,dz=target.z-position.z;
  const distance=Math.hypot(dx,dz);
  const vx=target.x-legStart.x,vz=target.z-legStart.z;
  const len=Math.hypot(vx,vz);
  const passed=len>1&&
   ((position.x-target.x)*vx+(position.z-target.z)*vz)>0&&
   Math.abs((position.x-legStart.x)*vz-(position.z-legStart.z)*vx)/len<600;

  if(routeIndex<4&&(distance<400||passed)){
   const old=route[routeIndex];
   routeIndex++;
   legStart={x:old.x,z:old.z,alt:old.alt};
   if(routeIndex===4&&!autopilot){
    message="FINAL APPROACH. Follow the glowing path. Tap APPROACH ASSIST if wanted.";
   }
  }

  if(routeIndex===4){
   const f=finalData();
   if(autopilot){
    gearDown=true;flaps=true;
    const stable=f.aligned&&Math.abs(deg(bank))<10&&
     airspeed*KNOTS>=130&&airspeed*KNOTS<=170&&
     Math.abs(f.height-f.targetHeight)<100&&velocity.y>-6;
    if(f.remaining<6500&&f.remaining>4000&&stable){
     disconnectAutopilot("",false);
     approachAssist=mode()!=="hard";
     message=approachAssist
      ?(mode()==="easy"
       ?"YOU HAVE CONTROL. Steer LEFT / RIGHT. Descent and flare assistance are ON."
       :"YOU HAVE CONTROL. Speed assistance is ON; manage descent manually.")
      :"YOU HAVE CONTROL. Hard mode: manage speed and descent manually.";
    }else if(f.remaining<4000&&!stable){
     goAround();
     message="Approach was not lined up safely. GO AROUND assistance started.";
    }
   }

   if(approachAssist&&!insideLandingAssistEnvelope(f)){
    approachAssist=false;
    message="Approach assistance OFF — outside the approach area or past the runway. GO AROUND is available.";
   }

   if(f.remaining< -airport.length){
    approachAssist=false;
    setRouteIndex(3);
    message="Runway passed. Add power and climb for another approach.";
   }
  }
 }

 function speedAssist(dt,targetKnots,targetVS=0){
  const speed=Math.max(airspeed,1);
  const density=1.225*Math.exp(-Math.max(0,position.y)/8500);
  const q=.5*density*speed*speed;
  let cl=clamp(
   .25+4.7*alpha+(flaps ? .65 : 0),-1,flaps?2.25:1.55
  );
  const stallAngle=rad(flaps?17:15);
  const stalled=Math.abs(alpha)>stallAngle;
  if(stalled)cl*=Math.max(.25,1-(Math.abs(alpha)-stallAngle)*3.5);
  const cd=.022+.045*cl*cl+
   (flaps ? .035 : 0)+(gearDown ? .018 : 0)+(stalled ? .12 : 0);
  const drag=q*AREA*cd;
  const availableThrust=MAX_THRUST*
   clamp(density/1.225,.3,1)*clamp(1-speed/600,.65,1);
  const desiredAcceleration=clamp((targetKnots/KNOTS-speed)*.12,-2,2);
  const climbFraction=clamp(targetVS/speed,-.25,.25);
  const requiredThrust=drag+MASS*G*climbFraction+MASS*desiredAcceleration;
  throttle=approach(
   throttle,clamp(requiredThrust/Math.max(1,availableThrust),0,1),dt,1.3
  );
 }
 function pitchCommand(targetPitch,authority){
  return clamp(
   (targetPitch-pitch)*1.8/Math.max(.04,.15*authority),-1,1
  );
 }
 function trimPitch(targetVS){
  const rho=1.225*Math.exp(-Math.max(0,position.y)/8500);
  const q=.5*rho*airspeed*airspeed;
  const required=MASS*G/Math.max(1,q*AREA*Math.cos(bank));
  const alphaTrim=clamp(
   (required-.25-(flaps ? .65 : 0))/4.7,rad(-2),rad(10)
  );
  return clamp(
   Math.atan2(targetVS,Math.max(airspeed,55))+alphaTrim+
   (targetVS-velocity.y)*.006,rad(-5),rad(13)
  );
 }
 function autopilotCommands(dt,authority){
  const t=steeringTarget();
  const dx=t.x-position.x,dz=t.z-position.z;
  const distance=Math.max(1,Math.hypot(dx,dz));
  const gs=Math.max(airspeed,70);
  const desiredYaw=Math.atan2(
   -(dx/distance*gs-wind.x),-(dz/distance*gs-wind.z)
  );
  const targetBank=clamp(wrapAngle(desiredYaw-yaw)*.7,rad(-22),rad(22));
  apTargetHeight=routeIndex===4
   ?Math.max(180,finalData().targetHeight):Math.max(150,routeHeight());
  const targetVS=clamp((apTargetHeight-(position.y-GROUND))*.035,-4.5,7);
  let targetPitch=trimPitch(targetVS);
  const slow=airspeed*KNOTS<(flaps?130:150);
  if(slow)targetPitch=Math.min(targetPitch,rad(3));
  apTargetSpeed=routeIndex>=2?(flaps?150:180):(flaps?165:210);
  speedAssist(dt,apTargetSpeed,targetVS);
  if(slow)throttle=1;
  return{pitchInput:pitchCommand(targetPitch,authority),targetBank};
 }

 const radar=$("radar"),radarCtx=radar.getContext("2d");
 function landingAdvice(){
  const f=finalData();
  if(f.remaining>10000)return"Follow the arrival route first.";
  if(Math.abs(f.x)>250&&f.height<100)return"OFF CENTRE — GO AROUND";
  if(f.outsideThreshold&&f.height<8)return"TOO LOW BEFORE RUNWAY — GO AROUND";
  if(airspeed*KNOTS<125)return"LOW SPEED — ADD POWER";
  if(airspeed*KNOTS>165)return"TOO FAST — REDUCE POWER";
  if(easyLandingAssistActive()){
   if(f.height<8)return"FLARE ASSIST — STEER LEFT / RIGHT ONLY";
   return"DESCENT ASSIST — KEEP RUNWAY CENTRED";
  }
  if(velocity.y< -6)return"REDUCE DESCENT — PULL BACK GENTLY";
  if(f.height<10&&!f.outsideThreshold)return"PULL BACK GENTLY · WINGS LEVEL";
  if(f.height>f.targetHeight+35)return"TOO HIGH — DESCEND GENTLY";
  if(f.height<f.targetHeight-25)return"TOO LOW — ADD POWER / CLIMB";
  if(Math.abs(f.x)>15)return f.x>0?"MOVE SLIGHTLY LEFT":"MOVE SLIGHTLY RIGHT";
  return"GOOD APPROACH — KEEP RUNWAY CENTRED";
 }
 function drawNavigation(){
  if(!route.length)return;
  const t=steeringTarget();
  const dx=t.x-position.x,dz=t.z-position.z;
  const desiredYaw=Math.atan2(-dx,-dz);
  const turn=deg(wrapAngle(yaw-desiredYaw));
  const heading=((airport.heading-deg(desiredYaw))%360+360)%360;
  const height=position.y-GROUND;
  const targetHeight=routeIndex===4?finalData().targetHeight:routeHeight();
  const turnText=Math.abs(turn)<8?"ON COURSE — LEVEL WINGS":
   turn>0?"TURN RIGHT "+Math.round(Math.abs(turn))+"°":
   "TURN LEFT "+Math.round(Math.abs(turn))+"°";
  $("navArrow").style.transform=`rotate(${turn}deg)`;
  $("navText").textContent=grounded
   ?"Next: "+airportName(destinationAirport)+"\nTake off straight ahead"
   :(autopilot?"AUTOPILOT ON\n":approachAssist?"ASSIST ON — YOU STEER\n":"")+
    turnText+"\nHeading "+
    String(Math.round(heading)%360).padStart(3,"0")+"°\n"+
    (routeIndex===4?landingAdvice():
     height>targetHeight+40?"DESCEND GENTLY":
     height<targetHeight-40?"CLIMB GENTLY":"HOLD HEIGHT")+
    "\nTarget "+Math.round(targetHeight*3.28084)+" ft"+
    (routeIndex===4?" · 140–150 kt":"");

  const ctx=radarCtx,cx=140,cy=140,radius=122;
  const farthest=Math.max(...airportSites.map(s=>
   Math.hypot(s.x-position.x,s.z-position.z)));
  const range=Math.max(6000,Math.hypot(dx,dz)*1.15,farthest*1.15);
  const scale=radius/range;
  ctx.clearRect(0,0,280,280);
  ctx.fillStyle="#061c22";ctx.fillRect(0,0,280,280);
  ctx.strokeStyle="#52d5b44d";ctx.lineWidth=1;
  for(const r of [radius/3,radius*2/3,radius]){
   ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx,12);ctx.lineTo(cx,268);
  ctx.moveTo(12,cy);ctx.lineTo(268,cy);ctx.stroke();

  function point(x,z){
   const a=x-position.x,b=z-position.z;
   return{
    x:cx+(a*Math.cos(yaw)-b*Math.sin(yaw))*scale,
    y:cy+(a*Math.sin(yaw)+b*Math.cos(yaw))*scale
   };
  }

  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.clip();
  ctx.strokeStyle="#68d6ef66";ctx.setLineDash([5,5]);ctx.beginPath();
  route.forEach((p,i)=>{
   const q=point(p.x,p.z);
   if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y);
  });
  ctx.stroke();ctx.setLineDash([]);
  for(const m of mountainColliders){
   const q=point(m.x,m.z);
   ctx.fillStyle="#b9936688";ctx.beginPath();
   ctx.arc(q.x,q.y,Math.max(2,m.rx*scale),0,Math.PI*2);ctx.fill();
  }
  airportSites.forEach((s,i)=>{
   const a=point(s.x,s.z+airport.length/2);
   const b=point(s.x,s.z-airport.length/2);
   ctx.strokeStyle=i===destinationAirport?"#86efac":"#eeeecc";
   ctx.lineWidth=5;ctx.beginPath();
   ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   const q=point(s.x,s.z);
   ctx.fillStyle=ctx.strokeStyle;ctx.font="bold 13px sans-serif";
   ctx.fillText(i===0?"A":"B",q.x+8,q.y);
  });
  const q=point(t.x,t.z);
  ctx.fillStyle="#79ffff";ctx.beginPath();
  ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle="#fff";ctx.beginPath();
  ctx.moveTo(cx,cy-11);ctx.lineTo(cx-7,cy+8);
  ctx.lineTo(cx,cy+4);ctx.lineTo(cx+7,cy+8);
  ctx.closePath();ctx.fill();
  ctx.fillStyle="#b5fce6";ctx.font="12px sans-serif";
  ctx.fillText("HEADING UP",10,18);
  $("radarText").textContent=
   "A/B AIRPORTS · GREEN DESTINATION · BROWN HILLS · "+
   (range/1000).toFixed(1)+" km";
 }

 function assetText(){

 function normalize(v){
  return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");
 }
 function find(root,name){
  let result=null;
  root.traverse(o=>{
   if(!result&&normalize(o.name)===normalize(name))result=o;
  });
  return result;
 }
 function calibrateEye(){
  const oldP=cockpitRig.position.clone(),oldQ=cockpitRig.quaternion.clone();
  try{
   cockpitRig.position.set(0,0,0);
   cockpitRig.quaternion.identity();
   cockpitRig.updateMatrixWorld(true);
   const yoke=find(cockpitModel,"yoke.capt");
   const bounds=new T.Box3().setFromObject(yoke||cockpitModel);
   if(!bounds.isEmpty()){
    if(yoke){
     pilotEye.copy(bounds.getCenter(new T.Vector3())).add(new T.Vector3(0,.5,.5));
    }else{
     const s=bounds.getSize(new T.Vector3());
     pilotEye.set(
      bounds.min.x+s.x*.3,bounds.min.y+s.y*.65,bounds.min.z+s.z*.65
     );
    }
   }
  }finally{
   cockpitRig.position.copy(oldP);
   cockpitRig.quaternion.copy(oldQ);
   cockpitRig.updateMatrixWorld(true);
  }
 }
 function installCockpit(root){
  const names=new Set();
  for(const [name,control] of [
   ["yoke.capt","yoke"],["yoke.FO","yoke"],
   ["pd.n1","throttle"],["pd.n2","throttle"],
   ["pd.flaps","flaps"],["pd.parking-brake","brakes"]
  ]){
   const o=find(root,name);
   if(!o?.parent)continue;
   o.userData.flightControl=control;
   names.add(control);
   o.updateWorldMatrix(true,true);
   const bounds=new T.Box3().setFromObject(o);
   if(bounds.isEmpty())continue;
   const center=bounds.getCenter(new T.Vector3());
   if(control!=="yoke")center.y=bounds.min.y;
   const parent=o.parent;
   parent.worldToLocal(center);
   const pivot=new T.Group();
   pivot.position.copy(center);
   parent.add(pivot);
   pivot.updateWorldMatrix(true,false);
   pivot.attach(o);
   const rigQ=cockpitRig.getWorldQuaternion(new T.Quaternion());
   const inv=pivot.getWorldQuaternion(new T.Quaternion()).invert();
   const axis=(x,y,z)=>new T.Vector3(x,y,z)
    .applyQuaternion(rigQ).applyQuaternion(inv).normalize();
   parts.push({
    pivot,control,base:pivot.quaternion.clone(),
    p:axis(1,0,0),r:axis(0,0,1)
   });
  }
  return [...names].join(", ")||"on-screen controls only";
 }
 function animateCockpit(){
  const a=new T.Quaternion(),b=new T.Quaternion();
  for(const p of parts){
   if(p.control==="yoke"){
    a.setFromAxisAngle(p.p,stickY*.1);
    b.setFromAxisAngle(p.r,-stickX*.55);
    p.pivot.quaternion.copy(p.base).multiply(a).multiply(b);
   }else{
    const angle=p.control==="throttle"?-throttle*.65:
     p.control==="flaps"?(flaps ? .45 : 0):(brakes ? .45 : 0);
    a.setFromAxisAngle(p.p,angle);
    p.pivot.quaternion.copy(p.base).multiply(a);
   }
  }
 }

 function isLearjetExterior(){
  return (loadedAircraftKey||loadingAircraftKey)==="learjet";
 }
 function learjetPosedBounds(){
  const bounds=new T.Box3(),vertex=new T.Vector3();
  aircraft.updateMatrixWorld(true);
  exteriorObject.traverse(o=>{
   if(o.isSkinnedMesh&&o.skeleton)o.skeleton.update();
  });

  function visit(o){
   if(!o.visible)return;
   if(o.isMesh&&o.geometry){
    const geometry=o.geometry;
    const positions=geometry.getAttribute("position");
    const materials=Array.isArray(o.material)?o.material:[o.material];
    const visibleMaterial=materials.some(m=>
     m&&m.visible!==false&&!(m.transparent&&m.opacity<=0));
    if(positions&&visibleMaterial){
     const index=geometry.getIndex();
     const count=index?index.count:positions.count;
     const rangeStart=Math.max(0,geometry.drawRange.start||0);
     const rangeCount=geometry.drawRange.count;
     const rangeEnd=Math.min(
      count,Number.isFinite(rangeCount)?rangeStart+rangeCount:count);
     const groups=geometry.groups.length?geometry.groups:
      [{start:0,count,materialIndex:0}];
     for(const group of groups){
      const material=Array.isArray(o.material)
       ?o.material[group.materialIndex||0]:o.material;
      if(!material||material.visible===false||
       (material.transparent&&material.opacity<=0))continue;
      const start=Math.max(rangeStart,group.start);
      const end=Math.min(rangeEnd,group.start+group.count);
      for(let i=start;i<end;i++){
       o.getVertexPosition(index?index.getX(i):i,vertex);
       vertex.applyMatrix4(o.matrixWorld);
       if(Number.isFinite(vertex.x)&&Number.isFinite(vertex.y)&&
        Number.isFinite(vertex.z))bounds.expandByPoint(vertex);
      }
     }
    }
   }
   for(const child of o.children)visit(child);
  }

  visit(exteriorYaw);
  if(bounds.isEmpty())bounds.setFromObject(exteriorYaw,true);
  return bounds;
 }
 function fitExterior(){
  if(!exteriorObject)return;
  const oldP=aircraft.position.clone(),oldQ=aircraft.quaternion.clone();
  try{
   aircraft.position.set(0,0,0);
   aircraft.quaternion.identity();
   exteriorAnchor.position.set(0,0,0);
   exteriorAnchor.scale.setScalar(1);
   exteriorYaw.rotation.y=rad(+$("exteriorYaw").value);
   exteriorTilt.rotation.x=rad(+$("exteriorPitch").value);
   aircraft.updateMatrixWorld(true);
   const bounds=isLearjetExterior()?learjetPosedBounds():
    new T.Box3().setFromObject(exteriorYaw);
   const size=bounds.getSize(new T.Vector3());
   const span=Math.max(size.x,size.z);
   if(!Number.isFinite(span)||span<=0||!Number.isFinite(bounds.min.y)){
    throw new Error("Invalid exterior dimensions.");
   }
   exteriorFit={
    span,center:bounds.getCenter(new T.Vector3()),minY:bounds.min.y
   };
  }finally{
   aircraft.position.copy(oldP);
   aircraft.quaternion.copy(oldQ);
   aircraft.updateMatrixWorld(true);
  }
  planeSize();
 }
 function planeSize(){
  const size=+$("planeSize").value;
  $("sizeOut").textContent=size;
  const fallbackScale=size/10.5;
  placeholder.scale.setScalar(fallbackScale);
  placeholder.position.y=-GROUND+1.4*fallbackScale;
  if(!exteriorFit)return;
  const scale=size/exteriorFit.span;
  exteriorAnchor.scale.setScalar(scale);
  const learjetLowering=isLearjetExterior()
   ?Number($("learjetLower").value):0;
  exteriorAnchor.position.set(
   -exteriorFit.center.x*scale,
   -GROUND-exteriorFit.minY*scale-learjetLowering,
   -exteriorFit.center.z*scale
  );
 }
 $("learjetLower").oninput=()=>{

  planeSize();

 $("exteriorYaw").onchange=()=>{

  savedExteriorYaw[key]=+$("exteriorYaw").value;

  }

  const angle=rad(+$("exteriorYaw").value);

 $("exteriorPitch").oninput=()=>{

 };
 function installExteriorAnimations(gltf){
  exteriorMixer=new T.AnimationMixer(gltf.scene);
  for(const type of ["gear","flap"]){
   const clips=gltf.animations.filter(c=>
    c.name.toLowerCase().includes(type)&&
    /(extend|deploy|retract)/i.test(c.name)&&!/door/i.test(c.name));
   const clip=clips.find(c=>/(extend|deploy)/i.test(c.name))||clips[0];
   if(!clip||clip.duration<=0)continue;
   const action=exteriorMixer.clipAction(clip);
   action.setLoop(T.LoopOnce,1);
   action.clampWhenFinished=true;
   action.play();
   action.paused=true;
   exteriorClips.push({
    type,clip,action,
    reverse:/retract/i.test(clip.name)&&!/(extend|deploy)/i.test(clip.name)
   });
  }
  animationStatus=exteriorClips.length
   ?"Exterior animation clips: "+
    exteriorClips.map(c=>c.clip.name).join(", ")+". Verify visually."
   :"No clearly named gear/flap deployment clips found; exterior remains as modeled.";
 }
 function updateExterior(dt,snap=false){
  const previousGear=exteriorGear,previousFlaps=exteriorFlaps;
  const f=snap?1:1-Math.exp(-dt*2);
  exteriorGear+=(Number(gearDown)-exteriorGear)*f;
  exteriorFlaps+=(Number(flaps)-exteriorFlaps)*f;
  placeholderGear.visible=exteriorGear>.5;
  if(isLearjetExterior()&&(snap||
   Math.abs(exteriorGear-previousGear)>.00001||
   Math.abs(exteriorFlaps-previousFlaps)>.00001)){
   learjetGroundFitPending=true;
  }
  if(exteriorMixer){
   exteriorClips.forEach(c=>{
    let v=c.type==="gear"?exteriorGear:exteriorFlaps;
    if(c.reverse)v=1-v;
    c.action.time=v*c.clip.duration;
   });
   exteriorMixer.update(0);
  }
  if(isLearjetExterior()&&exteriorObject&&exteriorFit&&grounded&&gearDown&&
   learjetGroundFitPending&&Math.abs(exteriorGear-1)<.001&&
   Math.abs(exteriorFlaps-Number(flaps))<.001){
   fitExterior();
   learjetGroundFitPending=false;
  }
 }

 function disposeModel(root){
  const gs=new Set(),ms=new Set(),ts=new Set();
  root.traverse(o=>{
   if(o.geometry)gs.add(o.geometry);
   const list=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];
   for(const m of list){
    ms.add(m);
    for(const value of Object.values(m)){
     if(value&&value.isTexture)ts.add(value);
    }
   }
  });
  gs.forEach(g=>g.dispose());
  ms.forEach(m=>m.dispose());
  ts.forEach(t=>t.dispose());
 }
 function releaseExterior(){
  if(exteriorMixer){
   exteriorMixer.stopAllAction();
   if(exteriorObject)exteriorMixer.uncacheRoot(exteriorObject);
  }
  exteriorClips.length=0;
  exteriorMixer=null;exteriorFit=null;
  if(exteriorObject){
   exteriorTilt.remove(exteriorObject);
   disposeModel(exteriorObject);
  }
  exteriorTilt.clear();
  exteriorObject=null;
  placeholder.visible=true;
  animationStatus="";
  learjetGroundFitPending=false;
 }
 function loadSelectedAircraft(){
  const key=$("aircraftChoice").value;
  const option=aircraftOptions[key];
  if(!option)return;
  if(loadedAircraftKey===key&&exteriorObject)return;
  if(loadingAircraftKey===key)return;
  const request=++exteriorRequest;
  loadingAircraftKey=key;
  loadedAircraftKey=null;
  releaseExterior();

  const initialYaw=savedExteriorYaw[key]??option.defaultYaw;
  const initialPitch=savedExteriorPitch[key]??option.defaultPitch;
  $("exteriorYaw").value=String(initialYaw);
  $("exteriorPitch").value=String(initialPitch);
  $("exteriorPitchOut").textContent=initialPitch+"°";
  exteriorYaw.rotation.y=rad(initialYaw);
  exteriorTilt.rotation.x=rad(initialPitch);
  planeSize();
  exteriorStatus=option.name+" downloading...";
  assetText();

  let textureFailed=false;
  const manager=new T.LoadingManager();
  manager.onError=url=>{
   if(request!==exteriorRequest)return;
   textureFailed=true;
   console.warn(option.name+" asset failed:",url);
   if(loadedAircraftKey===key){
    exteriorStatus=option.name+
     " loaded, but an associated asset failed. Check textures.";
    assetText();
   }
  };

  new GLTFLoader(manager).load(base+option.file,gltf=>{
   if(request!==exteriorRequest){disposeModel(gltf.scene);return;}
   try{
    exteriorObject=gltf.scene;
    
    // Apply the model-specific rotation correction here
    if (option.modelRotation) {
      exteriorObject.rotation.y = option.modelRotation;
    }

    exteriorTilt.add(exteriorObject);
    if(key==="learjet"){
     installExteriorAnimations(gltf);
     updateExterior(0,true);
     fitExterior();
     learjetGroundFitPending=!grounded;
    }else{
     fitExterior();
     installExteriorAnimations(gltf);
     updateExterior(0,true);
    }
    placeholder.visible=false;
    loadedAircraftKey=key;
    loadingAircraftKey=null;
    exteriorStatus=option.name+
     " loaded. Shared cockpit; aircraft-specific handling."+
     (textureFailed?" An associated asset failed.":"")+
     (key==="learjet"
      ?" Tilt: "+$("exteriorPitch").value+"°. Height adjustment remains available."
      :" Adjust Exterior nose direction or Exterior nose tilt if needed.");
   }catch(error){
    releaseExterior();
    loadedAircraftKey=loadingAircraftKey=null;
    exteriorStatus=option.name+" setup failed; placeholder retained. "+error.message;
    console.error(error);
   }
   assetText();
  },undefined,error=>{
   if(request!==exteriorRequest)return;
   loadingAircraftKey=loadedAircraftKey=null;
   placeholder.visible=true;
   exteriorStatus=option.name+" download failed. Check "+option.file+
    " exists in the main branch with this exact filename.";
   assetText();
   console.error(error);
  });
 }

 function physics(dt){
  if(state!=="playing")return;
  const previousPosition=position.clone();
  if(!grounded)airTime+=dt;

  let p=clamp(
   stickY+Number(keys.has("ArrowDown"))-Number(keys.has("ArrowUp")),-1,1
  );
  const r=clamp(
   stickX+Number(keys.has("ArrowRight"))-Number(keys.has("ArrowLeft")),-1,1
  );
  const rudder=Number(keys.has("q"))-Number(keys.has("e"));
  const flightMode=mode();
  if(keys.has("w"))throttle=Math.min(1,throttle+dt*.22);
  if(keys.has("s"))throttle=Math.max(0,throttle-dt*.22);

  airspeed=velocity.clone().sub(wind).length();
  const authority=clamp(airspeed/75,.08,1.25)*aircraftAgility;
  let command=null,assistedVS=null,assistActive=false;

  if(autopilot&&!grounded){
   command=autopilotCommands(dt,authority);
   p=command.pitchInput;
  }else if(goAroundTime>0&&!grounded){
   goAroundTime=Math.max(0,goAroundTime-dt);
   throttle=1;
   p=pitchCommand(airspeed*KNOTS<130?rad(3):rad(9),authority);
   command={targetBank:0};
  }else if(approachAssist&&!grounded){
   const f=finalData();

   assistActive=insideLandingAssistEnvelope(f);

   if(assistActive){
    const nearGround=f.height<20;
    const flare=f.height<8;
    const groundSpeed=Math.max(30,-velocity.z);

    let desiredVS=clamp(
     -groundSpeed*Math.tan(rad(3))+
     (f.targetHeight-f.height)*.045,
     -4,1.5
    );

    if(nearGround){
     desiredVS=clamp(desiredVS,-1.5,.5);
    }
    if(flare){
     desiredVS=-.65;
    }

    speedAssist(dt,flare?140:145,desiredVS);

    if(flightMode==="easy"){
     assistedVS=desiredVS;

     const manualTrim=nearGround?clamp(p,0,1):clamp(p,-1,1);
     let targetPitch=trimPitch(assistedVS)+
      manualTrim*rad(nearGround?1.5:3);
     targetPitch=clamp(
      targetPitch,rad(nearGround?0:-2),rad(10)
     );
     p=pitchCommand(targetPitch,authority);
    }
   }
  }

  enginePower=approach(
   enginePower,throttle,dt,throttle>enginePower?4.5:3
  );
  pitchRate=approach(pitchRate,p*.15*authority,dt,1/2.2);

  if(command){
   bankRate=approach(
    bankRate,clamp((command.targetBank-bank)*1.8,-rad(20),rad(20)),
    dt,.35
   );
  }else if(flightMode!=="hard"){
   const maxTurn=rad(
    assistActive?15:
    Math.min(60,(flightMode==="easy"?25:40)*aircraftAgility)
   );
   bankRate=approach(
    bankRate,
    clamp(
     (-r*maxTurn-bank)*1.8*aircraftAgility,
     -rad(22)*aircraftAgility,rad(22)*aircraftAgility
    ),
    dt,.35/aircraftAgility
   );
  }else{
   bankRate=approach(
    bankRate,-r*.32*authority,dt,.5/aircraftAgility
   );
  }

  if(!grounded){
   const scale=flightMode==="easy" ? .3 : flightMode==="medium" ? .65 : 1;
   const turbulence=weather.dark*weather.strength/14*scale;
   pitchRate+=Math.sin(weather.time*1.7)*turbulence*.013*dt;
   bankRate+=(Math.sin(weather.time*1.1)+.4*Math.sin(weather.time*2.8))*
    turbulence*.025*dt;
  }

  pitch=clamp(pitch+pitchRate*dt,rad(-25),rad(30));
  const bankLimit=rad(
   command?30:
   Math.min(75,(flightMode==="easy"?25:flightMode==="medium"?40:65)*
    aircraftAgility)
  );
  bank=clamp(bank+bankRate*dt,-bankLimit,bankLimit);

  if(grounded){
   bank*=Math.exp(-dt*8);
   pitch=clamp(pitch,0,airspeed>65?rad(12):rad(1.5));
   yaw+=(rudder-r)*.1*clamp(velocity.length()/30,0,1)*dt;
  }else{
   yaw+=(Math.tan(bank)*G/Math.max(airspeed,45)+rudder*.055)*dt;
  }
  orient();

  const forward=new T.Vector3(0,0,-1).applyQuaternion(rotation);
  const right=new T.Vector3(1,0,0).applyQuaternion(rotation);
  const up=new T.Vector3(0,1,0).applyQuaternion(rotation);
  const air=velocity.clone().sub(wind);
  airspeed=air.length();
  const direction=airspeed>.1?air.clone().divideScalar(airspeed):forward.clone();

  alpha=airspeed>10
   ?Math.atan2(-air.dot(up),Math.max(1,air.dot(forward))):0;
  const beta=airspeed>10
   ?Math.asin(clamp(air.dot(right)/airspeed,-1,1)):0;

  const density=1.225*Math.exp(-Math.max(0,position.y)/8500);
  const q=.5*density*airspeed*airspeed;
  let cl=clamp(
   .25+4.7*alpha+(flaps ? .65 : 0),-1,flaps?2.25:1.55
  );
  const stallAngle=rad(flaps?17:15);
  const stalled=Math.abs(alpha)>stallAngle;
  if(stalled){
   cl*=Math.max(.25,1-(Math.abs(alpha)-stallAngle)*3.5);
  }
  const cd=.022+.045*cl*cl+
   (flaps ? .035 : 0)+(gearDown ? .018 : 0)+(stalled ? .12 : 0);
  const lift=up.clone().addScaledVector(direction,-up.dot(direction));
  if(lift.lengthSq()>.0001)lift.normalize();
  else lift.copy(up);

  const thrust=MAX_THRUST*enginePower*
   clamp(density/1.225,.3,1)*clamp(1-airspeed/600,.65,1);
  const force=new T.Vector3(0,-MASS*G,0);
  force.addScaledVector(forward,thrust);
  const assistance=flightMode==="easy"?1:flightMode==="medium" ? .5 : 0;
  const turnAssist=grounded?1:
   1+(1/Math.max(Math.cos(bank),.7)-1)*assistance;
  force.addScaledVector(lift,q*AREA*cl*turnAssist);
  force.addScaledVector(direction,-q*AREA*cd);
  force.addScaledVector(right,-q*AREA*.8*beta);

  if(assistedVS!==null){
   const correction=clamp(
    (assistedVS-velocity.y)*1.8-force.y/MASS,-5,6
   );
   force.y+=MASS*correction;
  }

  velocity.addScaledVector(force,dt/MASS);

  if(grounded){
   const h=new T.Vector3(velocity.x,0,velocity.z);
   const speed=h.length();
   if(speed>.001){
    const braking=brakes?(3.5-weather.rain*.6):.12;
    const loss=Math.min(speed,braking*dt);
    velocity.x-=h.x/speed*loss;
    velocity.z-=h.z/speed*loss;
   }
   const flatRight=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
   velocity.addScaledVector(
    flatRight,-velocity.dot(flatRight)*Math.min(1,dt*6)
   );
   if(force.y>0&&airspeed>65&&pitch>rad(2)){
    grounded=false;landed=false;
    resetRoute();
    message="Airborne. Fly toward "+airportName(destinationAirport)+
     ". Autopilot is available above 165 ft.";
   }else{
    velocity.y=0;
   }
  }

  position.addScaledVector(velocity,dt);

  const hit=mountainHit(previousPosition,position);
  if(hit!==null){
   position.lerpVectors(previousPosition,position,Math.max(0,hit-.001));
   crash("Mountain impact. Watch the brown hills on radar and keep clear.");
   return;
  }

  if(!grounded&&position.y<=GROUND){
   const sink=Math.max(0,-velocity.y);
   position.y=GROUND;
   const l=limits(),reasons=[];
   const arrivedAt=runwayAt(position.x,position.z,runwayMargin());

   if(arrivedAt<0)reasons.push("touchdown outside the runway");
   if(!gearDown)reasons.push("landing gear is UP");
   if(deg(pitch)<l.minPitch||deg(pitch)>l.maxPitch){
    reasons.push("pitch outside landing limits");
   }
   if(Math.abs(deg(bank))>l.bank)reasons.push("too much bank");
   if(sink>l.sink){
    reasons.push("descent "+sink.toFixed(1)+" m/s is too hard");
   }
   if(airspeed*KNOTS>l.speed)reasons.push("touchdown too fast");
   if(alignmentError()>l.yaw)reasons.push("not aligned with runway");

   if(reasons.length){
    crash(reasons.join("; ")+".");return;
   }

   const reached=arrivedAt===destinationAirport;
   autopilot=approachAssist=false;goAroundTime=0;
   velocity.y=0;
   grounded=landed=true;
   pitchRate=bankRate=0;
   pitch=clamp(pitch,0,rad(8));
   bank=0;
   groundedAirport=arrivedAt;

   if(flightMode==="easy"){
    throttle=0;brakes=true;
   }
   resetRoute();

   message=reached
    ?"LANDED at "+airportName(arrivedAt)+"! "+
     (flightMode==="easy"?"Brakes applied. ":"Idle thrust and brake. ")+
     "Next: "+airportName(destinationAirport)+"."
    :"Touchdown accepted. Next: "+airportName(destinationAirport)+".";
   buttons();
  }

  if(grounded){
   position.y=GROUND;
   if(runwayAt(position.x,position.z,runwayMargin())<0){
    crash("You left the runway.");return;
   }
   if(landed&&velocity.length()<1){
    message="Parked at "+airportName(groundedAirport)+
     ". Turn around if needed, release brakes, and take off for "+
     airportName(destinationAirport)+".";
   }
  }

  if(!grounded&&stalled)pitchRate-=.08*dt;

  if(![
   position.x,position.y,position.z,velocity.x,velocity.y,velocity.z,
   pitch,bank,yaw
  ].every(Number.isFinite)){
   crash("Simulation calculation error.");return;
  }
  orient();
 }

 function updateAircraft(){
  aircraft.position.copy(position);
  aircraft.quaternion.copy(rotation);
  aircraft.visible=chase&&!["menu","crashed"].includes(state);
  cockpitRig.position.copy(position);
  cockpitRig.quaternion.copy(rotation);
  cockpitRig.visible=cockpitReady&&!chase&&!["menu","crashed"].includes(state);
  approachPath.visible=
   !["menu","crashed"].includes(state)&&!grounded&&routeIndex>=2;
  animateCockpit();
 }
 function updateCamera(dt,snap=false){
  if(state==="menu")return;
  if(chase){
   const distance=+$("cameraDistance").value,a=yaw+orbitYaw;
   const offset=new T.Vector3(
    Math.sin(a)*Math.cos(orbitPitch)*distance,
    Math.sin(orbitPitch)*distance+3,
    Math.cos(a)*Math.cos(orbitPitch)*distance
   );
   const desired=position.clone().add(offset);
   desired.y=Math.max(2,desired.y);
   if(snap||lookDrag)camera.position.copy(desired);
   else camera.position.lerp(desired,1-Math.exp(-dt*7));
   camera.up.set(0,1,0);
   camera.lookAt(position.clone().add(new T.Vector3(0,1,0)));
  }else{
   camera.position.copy(
    pilotEye.clone().add(eyeOffset).applyQuaternion(rotation).add(position)
   );
   const look=new T.Quaternion().setFromEuler(new T.Euler(
    rad(+$("lookPitch").value)+headPitch,
    rad(+$("lookYaw").value)+headYaw,0,"YXZ"
   ));
   camera.quaternion.copy(rotation).multiply(look);
  }
  const near=chase ? .2 : .02;
  if(camera.near!==near){
   camera.near=near;
   camera.updateProjectionMatrix();
  }
 }
 function hud(){
  syncControls();assistDisplay();
  $("speed").textContent=Math.round(airspeed*KNOTS)+" kt";
  $("altitude").textContent=
   Math.max(0,Math.round((position.y-GROUND)*3.28084))+" ft";
  $("vertical").textContent=Math.round(velocity.y*196.85)+" ft/min";
  const heading=((airport.heading-deg(yaw))%360+360)%360;
  $("heading").textContent=String(Math.round(heading)%360).padStart(3,"0")+"°";
  $("timer").textContent=airTime.toFixed(1)+" s";
  $("pitchValue").textContent=deg(pitch).toFixed(1)+"°";
  $("bankValue").textContent=deg(bank).toFixed(1)+"°";

  const l=limits();
  const ok=deg(pitch)>=l.minPitch&&deg(pitch)<=l.maxPitch&&
   Math.abs(deg(bank))<=l.bank&&Math.max(0,-velocity.y)<=l.sink&&
   airspeed*KNOTS<=l.speed&&alignmentError()<=l.yaw&&gearDown;
  $("landingHint").textContent=
   "Landing: pitch "+l.minPitch+"° to +"+l.maxPitch+
   "° · bank ±"+l.bank+"° · descent ≤"+l.sink+
   " m/s · speed ≤"+l.speed+" kt · gear "+(gearDown?"DOWN":"UP")+
   (routeIndex===4&&!grounded?" · "+landingAdvice():"");
  $("landingHint").style.color=ok?"#86efac":"#fde68a";

  const stalled=!grounded&&Math.abs(alpha)>rad(flaps?17:15);
  const warning=terrainWarning();
  $("status").textContent=(state==="paused"?"PAUSED — ":"")+
   (warning?"TERRAIN AHEAD — CLIMB OR TURN AWAY! ":
    stalled&&state==="playing"?"LOW LIFT / STALL — ":"")+
   (autopilot?"AUTOPILOT — ":approachAssist?"APPROACH ASSIST — ":"")+message;
 }

 const primary=e=>e.pointerType!=="mouse"||e.button===0;
 const stick=$("stick"),lever=$("lever");

 stick.onpointerdown=e=>{
  if(state!=="playing"||stickDrag||cockpitDrag||!primary(e))return;
  e.preventDefault();
  manualControl("yoke");
  stickDrag={id:e.pointerId,x:e.clientX,y:e.clientY};
  stick.setPointerCapture(e.pointerId);
 };
 stick.onpointermove=e=>{
  if(stickDrag?.id!==e.pointerId||state!=="playing")return;
  e.preventDefault();
  stickX=clamp(
   (e.clientX-stickDrag.x)/Math.max(35,stick.clientWidth*.3),-1,1);
  stickY=clamp(
   (e.clientY-stickDrag.y)/Math.max(30,stick.clientHeight*.3),-1,1);
 };
 lever.onpointerdown=e=>{
  if(state!=="playing"||leverDrag||
   cockpitDrag?.control==="throttle"||!primary(e))return;
  e.preventDefault();
  manualControl("throttle");
  leverDrag={id:e.pointerId,y:e.clientY,power:throttle};
  lever.setPointerCapture(e.pointerId);
 };
 lever.onpointermove=e=>{
  if(leverDrag?.id!==e.pointerId||state!=="playing")return;
  e.preventDefault();
  throttle=clamp(
   leverDrag.power+(leverDrag.y-e.clientY)/Math.max(35,lever.clientHeight-42),
   0,1
  );
 };
 function hitControl(e){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.set(
   (e.clientX-rect.left)/rect.width*2-1,
   -(e.clientY-rect.top)/rect.height*2+1
  );
  scene.updateMatrixWorld(true);
  camera.updateMatrixWorld(true);
  raycaster.setFromCamera(pointer,camera);
  for(const hit of raycaster.intersectObject(cockpitModel,true)){
   let o=hit.object;
   const ms=Array.isArray(o.material)?o.material:[o.material];
   if(ms.every(m=>m&&!m.visible))continue;
   while(o&&o!==cockpitRig){
    if(o.userData.flightControl)return o.userData.flightControl;
    o=o.parent;
   }
   return null;
  }
  return null;
 }
 renderer.domElement.onpointerdown=e=>{
  if(state==="menu"||lookDrag||cockpitDrag||!primary(e))return;
  const control=!chase&&cockpitReady&&state==="playing"?hitControl(e):null;
  if(control){
   if(stickDrag||(control==="throttle"&&leverDrag))return;
   e.preventDefault();
   if(control==="flaps"){flaps=!flaps;buttons();return;}
   if(control==="brakes"){brakes=!brakes;buttons();return;}
   manualControl(control);
   cockpitDrag={
    id:e.pointerId,control,x:e.clientX,y:e.clientY,power:throttle
   };
  }else{
   e.preventDefault();
   lookDrag={id:e.pointerId,x:e.clientX,y:e.clientY};
  }
  renderer.domElement.setPointerCapture(e.pointerId);
 };
 renderer.domElement.onpointermove=e=>{
  if(cockpitDrag?.id===e.pointerId&&state==="playing"){
   e.preventDefault();
   const d=cockpitDrag,rect=renderer.domElement.getBoundingClientRect();
   if(d.control==="yoke"){
    const travel=Math.max(50,Math.min(rect.width,rect.height)*.2);
    stickX=clamp((e.clientX-d.x)/travel,-1,1);
    stickY=clamp((e.clientY-d.y)/travel,-1,1);
   }else{
    throttle=clamp(
     d.power-(e.clientY-d.y)/Math.max(100,rect.height*.5),0,1);
   }
  }else if(lookDrag?.id===e.pointerId){
   e.preventDefault();
   const dx=e.clientX-lookDrag.x,dy=e.clientY-lookDrag.y;
   lookDrag.x=e.clientX;lookDrag.y=e.clientY;
   if(chase){
    orbitYaw-=dx*.006;
    orbitPitch=clamp(orbitPitch+dy*.005,rad(-15),rad(80));
   }else{
    headYaw-=dx*.005;
    headPitch=clamp(headPitch-dy*.005,rad(-75),rad(75));
   }
   updateCamera(0,true);
  }
 };
 for(const name of ["pointerup","pointercancel","lostpointercapture"]){
  stick.addEventListener(name,e=>{
   if(stickDrag?.id===e.pointerId){
    stickDrag=null;stickX=stickY=0;
   }
  });
  lever.addEventListener(name,e=>{
   if(leverDrag?.id===e.pointerId)leverDrag=null;
  });
  renderer.domElement.addEventListener(name,e=>{
   if(cockpitDrag?.id===e.pointerId){
    if(cockpitDrag.control==="yoke")stickX=stickY=0;
    cockpitDrag=null;
   }
   if(lookDrag?.id===e.pointerId)lookDrag=null;
  });
 }

 $("launch").onclick=start;
 $("restart").onclick=setup;
 $("pause").onclick=pause;
 $("gear").onclick=toggleGear;
 $("flaps").onclick=()=>{
  if(state==="playing"){flaps=!flaps;buttons();}
 };
 $("brakes").onclick=()=>{
  if(state==="playing"){brakes=!brakes;buttons();}
 };
 $("camera").onclick=()=>{
  if(chase&&!cockpitReady){
   message="Cockpit not available yet. Exterior remains active.";return;
  }
  clearControls();
  chase=!chase;
  buttons();updateAircraft();updateCamera(1,true);
 };
 window.addEventListener("keydown",e=>{
  if(["INPUT","SELECT","TEXTAREA","BUTTON","SUMMARY"].includes(e.target?.tagName)){
   return;
  }
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","q","e","w","s"]
   .includes(k)&&state==="playing"){
   e.preventDefault();
   manualControl(k==="w"||k==="s"?"throttle":"yoke");
   keys.add(k);
  }
  if(!e.repeat){
   if(k==="p")pause();
   if(k==="a")toggleAutopilot();
   if(k==="l")toggleApproachAssist();
   if(k==="r")goAround();
   if(k==="g")toggleGear();
   if(k==="f"&&state==="playing"){flaps=!flaps;buttons();}
   if(k==="b"&&state==="playing"){brakes=!brakes;buttons();}
  }
 });
 window.addEventListener("keyup",e=>{
  keys.delete(e.key.length===1?e.key.toLowerCase():e.key);
 });
 function suspend(){
  clearControls();
  if(state==="playing")pause();
 }
 window.addEventListener("blur",suspend);
 document.addEventListener("visibilitychange",()=>{
  if(document.hidden)suspend();
 });
 renderer.domElement.addEventListener("webglcontextlost",e=>{
  e.preventDefault();
  stopped=true;
  suspend();
  window.gameFatal("Graphics context lost. Reload the app.");
 });

 function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  rainWidth=w;rainHeight=h;
  const dpr=Math.min(devicePixelRatio||1,1.5);
  rainCanvas.width=Math.round(w*dpr);
  rainCanvas.height=Math.round(h*dpr);
  rainCtx.setTransform(dpr,0,0,dpr,0,0);
  syncControls();
 }
 const resizeObserver=new ResizeObserver(resize);
 resizeObserver.observe(stage);
 window.addEventListener("resize",resize);

 readEye();planeSize();buildMap();resetWeather();resetRoute();resize();
 approachPath.visible=false;
 camera.position.set(130,100,airport.length/2+220);
 camera.lookAt(0,0,airport.length/2-500);
 $("launch").disabled=false;
 $("camera").disabled=false;
 $("restart").disabled=false;
 $("launch").textContent="Start flight";
 $("notice").textContent=
  "World ready. Aircraft assets are downloading; you can start now.";
 buttons();hud();assetText();weatherVisuals();drawNavigation();

 let previous=performance.now(),uiClock=0;
 function frame(now){
  if(stopped)return;
  try{
   const dt=clamp((now-previous)/1000,0,.05);
   previous=now;
   if(state==="playing"){
    updateWeather(dt);
    const steps=Math.max(1,Math.ceil(dt/.008));
    for(let i=0;i<steps;i++)physics(dt/steps);
    updateExterior(dt);
    if(state==="playing")updateNavigation();
   }
   if(state!=="menu"){
    updateAircraft();updateCamera(dt);
   }else{
    approachPath.visible=false;
    // Spin the menu preview plane
    previewGroup.rotation.y += dt * 0.5;
    previewRenderer.render(previewScene, previewCamera);
   }
   if(state==="crashed")updateExplosion(dt);
   weatherVisuals();
   drawRain(state==="playing"?dt:0);
   uiClock+=dt;
   if(uiClock>.07){
    hud();drawNavigation();uiClock=0;
   }
   renderer.render(scene,camera);
   requestAnimationFrame(frame);
  }catch(error){
   stopped=true;
   suspend();
   window.gameFatal("Game stopped: "+error.message+". Reload to restart.");
   console.error(error);
  }
 }
 requestAnimationFrame(frame);

 let textureFailure=false;
 const cm=new T.LoadingManager();
 cm.onError=url=>{
  textureFailure=true;
  console.warn("Cockpit asset failed:",url);
 };
 new GLTFLoader(cm).load(base+"cockpit.glb",gltf=>{
  const oldP=cockpitRig.position.clone(),oldQ=cockpitRig.quaternion.clone();
  try{
   cockpitRig.position.set(0,0,0);
   cockpitRig.quaternion.identity();
   cockpitModel.add(gltf.scene);
   cockpitModel.rotation.set(0,-Math.PI/2,0);
   cockpitRig.updateMatrixWorld(true);
   const bounds=new T.Box3().setFromObject(cockpitModel);
   if(bounds.isEmpty())throw new Error("Empty cockpit model.");
   cockpitModel.position.x-=bounds.getCenter(new T.Vector3()).x;
   cockpitModel.position.y+=-1.2-bounds.min.y;
   cockpitRig.updateMatrixWorld(true);

   const seen=new Set();
   gltf.scene.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    for(const m of Array.isArray(o.material)?o.material:[o.material]){
     if(seen.has(m))continue;
     seen.add(m);
     const image=m.map?.image;
     const names=[m.name,m.map?.name,image?.currentSrc||image?.src].join(" ");
     if(/window[-_ ]?trans/i.test(names)){
      glassMaterials.push({material:m,visible:m.visible});
     }
    }
   });

   applyGlass();
   calibrateEye();
   cockpitStatus="Shared cockpit loaded. Controls: "+installCockpit(gltf.scene)+
    (textureFailure?". Some textures failed.":".");
   cockpitReady=true;
   $("notice").textContent="Cockpit ready. Drag empty areas to look around.";
  }catch(error){
   cockpitReady=false;
   cockpitStatus="Cockpit setup failed; exterior flight remains available.";
   $("notice").textContent=cockpitStatus;
   console.error(error);
  }finally{
   cockpitRig.position.copy(oldP);
   cockpitRig.quaternion.copy(oldQ);
   cockpitRig.updateMatrixWorld(true);
   assetText();
  }
 },undefined,error=>{
  cockpitStatus="Cockpit download failed. Check cockpit.glb and its texture files.";
  $("notice").textContent="Cockpit unavailable. Exterior flight remains available.";
  assetText();
  console.error(error);
 });

 loadSelectedAircraft();
 updateMenuPreview("boeing737");
}
</script>
